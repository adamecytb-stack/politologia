<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Politológia – štát a typy štátov</title>
<meta name="description" content="Učebná appka z politológie (9. ročník): štát, moc, občianstvo, územie, suverenita, symboly a typy štátov. Lekcie s písanými otázkami a písomka nanečisto.">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Politológia">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
  /* svetly minimalisticky vzhlad: biela plocha, tmavy text, jedna modra, ciary namiesto kariet */
  :root{
    --bg:#ffffff;
    --soft:#f5f6f8;
    --line:#e4e7ec;
    --ink:#12141a;
    --muted:#636b7a;
    --faint:#9aa1ae;
    --accent:#2349d8;
    --accent-ink:#1a36a6;
    --accent-soft:#eef2fd;
    --learn:#9db1f2;
    --ok:#13803b;
    --ok-soft:#eaf6ee;
    --ok-ink:#0e5f2c;
    --bad:#c52a1f;
    --bad-soft:#fcedeb;
    --leg:#2349d8;
    --exe:#b45309;
    --jus:#0f766e;
    --font:"Figtree", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;}
  .wrap{
    max-width:640px;margin:0 auto;min-height:100vh;
    padding:12px max(20px, env(safe-area-inset-right)) 40px max(20px, env(safe-area-inset-left));
    padding-top:max(12px, env(safe-area-inset-top));
    display:flex;flex-direction:column;gap:28px;
  }
  .wrap.flow{gap:24px;padding-bottom:0;}
  h1{font-size:30px;font-weight:600;line-height:1.15;letter-spacing:-.6px;margin:0;text-wrap:balance;}
  h2{font-size:24px;font-weight:600;line-height:1.25;letter-spacing:-.3px;margin:0;text-wrap:balance;}
  h3{font-size:18px;font-weight:600;line-height:1.3;margin:0;}
  p{margin:0;}
  b{font-weight:600;}
  .muted{color:var(--muted);}
  .small{font-size:14px;}
  .label{font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted);}
  .stack{display:flex;flex-direction:column;gap:12px;}
  .stack.tight{gap:6px;}
  .stack.loose{gap:20px;}
  .center{text-align:center;}

  /* ---- tlacidla ---- */
  .btn{
    display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    height:54px;padding:0 18px;border:none;border-radius:12px;cursor:pointer;
    background:var(--accent);color:#fff;font-size:17px;font-weight:600;
  }
  .btn:disabled{background:#c9d2ee;cursor:default;}
  .btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--ink);height:50px;font-size:16px;}
  .btn.soft{background:var(--soft);color:var(--ink);height:50px;font-size:16px;}
  .btn svg{flex:0 0 auto;}
  .ibtn{
    flex:0 0 44px;width:44px;height:44px;border-radius:10px;border:none;background:transparent;
    display:flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer;
  }
  .ibtn.out{border:1px solid var(--line);}
  .tbtn{
    height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);
    display:flex;align-items:center;gap:6px;color:var(--ink);font-weight:600;font-size:15px;cursor:pointer;
  }
  .linkbtn{background:none;border:none;padding:0;font:inherit;color:var(--muted);text-decoration:underline;cursor:pointer;}
  .back{
    height:44px;padding:0 12px 0 4px;margin-left:-6px;border:none;background:transparent;border-radius:10px;
    display:flex;align-items:center;gap:4px;font-weight:600;font-size:15px;color:var(--ink);cursor:pointer;
  }

  /* ---- hlavicka ---- */
  .top{display:flex;align-items:center;gap:8px;min-height:44px;}
  .top .sp{flex:1;}
  .brand{display:flex;flex-direction:column;line-height:1.3;}
  .brand b{font-size:17px;font-weight:700;letter-spacing:-.2px;}
  .brand span{font-size:13px;color:var(--muted);}

  /* ---- domov ---- */
  .homegrid{display:flex;flex-direction:column;gap:36px;}
  .hero{display:flex;flex-direction:column;gap:14px;}
  .lbar{height:4px;border-radius:999px;background:var(--line);overflow:hidden;}
  .lbar span{display:block;height:4px;background:var(--ink);border-radius:999px;}
  .topics{display:flex;flex-direction:column;}
  .trow{
    display:flex;gap:14px;width:100%;text-align:left;background:transparent;border:none;
    border-top:1px solid var(--line);padding:16px 0;color:var(--ink);cursor:pointer;font-size:16px;
  }
  .trow .tn{flex:0 0 16px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;}
  .trow .tb{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;}
  .trow .tt{font-weight:600;font-size:17px;line-height:1.25;}
  .chev{flex:0 0 18px;color:var(--faint);margin-top:2px;}
  .dots{display:flex;flex-wrap:wrap;gap:4px;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--line);}
  .dot.l{background:var(--learn);}
  .dot.k{background:var(--ink);}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;border-top:1px solid var(--line);padding-top:12px;font-size:12.5px;color:var(--muted);}
  .legend span{display:flex;align-items:center;gap:6px;}
  .box{border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;}
  .tab{
    height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);
    font-size:14.5px;font-weight:600;color:var(--ink);cursor:pointer;
  }
  .tab.on{background:var(--ink);border-color:var(--ink);color:#fff;}
  .foot{font-size:13px;color:var(--muted);line-height:1.5;}

  /* ---- tema ---- */
  .crow{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:none;
    border-top:1px solid var(--line);padding:14px 0;color:var(--ink);cursor:pointer;font-size:16px;
  }
  .crow:last-child{border-bottom:1px solid var(--line);}
  .crow .cb{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .crow .ct{font-weight:600;}
  .crow .cs{font-size:13.5px;color:var(--muted);}
  .pill{font-size:12.5px;font-weight:600;padding:4px 9px;border-radius:999px;white-space:nowrap;background:var(--soft);color:var(--muted);}
  .pill.l{background:var(--accent-soft);color:var(--accent-ink);}
  .pill.k{background:var(--ink);color:#fff;}

  /* ---- lekcia (obsah) ---- */
  .kick{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;font-size:13px;font-weight:600;color:var(--muted);}
  .kick .a{color:var(--accent);}
  .kick .sep{color:#c2c7d0;}
  .kick .tag{margin-left:auto;font-weight:500;}
  .sec{font-size:19px;font-weight:600;line-height:1.3;margin-top:10px;}
  .rows{display:flex;flex-direction:column;border-bottom:1px solid var(--line);}
  .rows .r{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:12px 0;border-top:1px solid var(--line);}
  .rows .r .k{font-size:18px;font-weight:600;flex:0 1 auto;}
  .rows .r .v{font-size:16px;text-align:right;flex:0 1 62%;}
  .pts{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;}
  .pts.num{padding-left:24px;}
  .note{display:flex;gap:10px;font-size:15px;line-height:1.5;}
  .note svg{flex:0 0 20px;margin-top:2px;}
  .note .nl{color:var(--muted);}
  .extra{border:1px dashed #c2c7d0;border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.5;}
  .extra .nl{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:2px;}
  .warn{background:#fff6e5;border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.5;}
  .warn .nl{display:block;font-size:12.5px;font-weight:700;color:#8a5a00;margin-bottom:2px;}
  .powers{display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:10px;}
  .pw{border-top:3px solid var(--leg);padding-top:10px;display:flex;flex-direction:column;gap:4px;}
  .pw.exe{border-color:var(--exe);}
  .pw.jus{border-color:var(--jus);}
  .pw .pn{font-weight:700;font-size:16px;color:var(--leg);line-height:1.2;}
  .pw.exe .pn{color:var(--exe);}
  .pw.jus .pn{color:var(--jus);}
  .pw .pk{font-size:13px;color:var(--muted);line-height:1.3;}
  .pw .pi{font-size:14.5px;font-weight:600;line-height:1.3;margin-top:6px;}
  .figs{display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap;}
  .figs figure{margin:0;display:flex;flex-direction:column;gap:6px;align-items:flex-start;}
  .figs figcaption{font-size:13px;color:var(--muted);}

  /* ---- otazky ---- */
  .ftop{display:flex;align-items:center;gap:12px;min-height:44px;}
  .ftop .ibtn{margin-left:-10px;}
  .prog{flex:1;height:4px;border-radius:999px;background:var(--line);overflow:hidden;}
  .prog span{display:block;height:4px;background:var(--ink);border-radius:999px;transition:width .3s ease;}
  .cnt{font-size:13.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .dock{
    position:-webkit-sticky;position:sticky;bottom:0;z-index:5;margin-top:auto;
    display:flex;flex-direction:column;gap:10px;background:var(--bg);
    padding:12px 0 max(20px, env(safe-area-inset-bottom));
  }
  .srs{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45;color:var(--muted);}
  .srs svg{flex:0 0 18px;margin-top:1px;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:15px;font-weight:600;line-height:1.35;}
  .inrow{display:flex;gap:12px;align-items:center;}
  .inrow .ix{flex:0 0 16px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;}
  .txtin{
    flex:1;min-width:0;width:100%;height:54px;padding:0 14px;border-radius:12px;border:1px solid #cfd4dc;background:var(--bg);
    font-family:inherit;font-size:18px;font-weight:500;color:var(--ink);outline:none;
  }
  textarea.txtin{height:auto;min-height:92px;padding:12px 14px;line-height:1.45;resize:vertical;}
  .txtin:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .txtin.okin{border-color:var(--ok);background:var(--ok-soft);}
  .txtin.badin{border-color:var(--bad);background:var(--bad-soft);}
  .txtin:disabled{opacity:1;-webkit-text-fill-color:var(--ink);}
  .hint2{font-size:14px;color:var(--muted);}
  .fb{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;font-size:15.5px;line-height:1.5;}
  .fb.ok{background:var(--ok-soft);}
  .fb.no{background:var(--bad-soft);}
  .fb .head{font-weight:700;font-size:16px;}
  .fb.ok .head{color:var(--ok-ink);}
  .fb.no .head{color:var(--bad);}
  .fb .linkbtn{align-self:flex-start;color:var(--ink);font-size:14.5px;}

  /* ---- vysledky ---- */
  .grade{font-size:96px;font-weight:600;line-height:1;letter-spacing:-3px;text-align:center;}
  .stats{display:flex;justify-content:center;gap:28px;}
  .stat{display:flex;flex-direction:column;align-items:center;font-size:13.5px;color:var(--muted);}
  .stat b{font-size:24px;color:var(--ink);font-variant-numeric:tabular-nums;}
  .miss{padding:14px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;font-size:15px;}
  .miss .mq{font-weight:600;font-size:16px;}
  .miss .yours{color:var(--bad);}
  .miss .right{color:var(--ok-ink);}

  /* ---- tahak ---- */
  .ch{display:flex;flex-direction:column;}
  .ch .ci{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px;}
  .ch .ci h3{font-size:16px;}
  .ch .ci div{font-size:15px;line-height:1.5;color:#2c313c;}

  @media (hover:hover){
    .btn:hover:enabled{background:var(--accent-ink);}
    .btn.ghost:hover:enabled{background:var(--soft);}
    .btn.soft:hover:enabled{background:#eceef2;}
    .trow:hover .tt, .crow:hover .ct{color:var(--accent);}
    .tab:hover, .tbtn:hover{border-color:var(--ink);}
  }
  button:focus-visible, .txtin:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
  @media (min-width:900px){
    .wrap.home{max-width:1040px;}
    .homegrid{display:grid;grid-template-columns:minmax(0, 1fr) minmax(0, 1.1fr);gap:56px;align-items:start;}
    .wrap{padding-top:28px;}
    .wrap.flow .dock{padding-bottom:28px;}
  }
  @media (max-width:360px){
    .powers{grid-template-columns:1fr;}
    .rows .r{flex-direction:column;gap:2px;}
    .rows .r .v{text-align:left;}
  }
  @media (prefers-reduced-motion:reduce){
    .prog span{transition:none;}
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============================================================
   UCEBNA APLIKACIA - POLITOLOGIA: STAT A TYPY STATOV
   Obsah je zo skolskeho zosita. Bloky "extra" su dovysvetlenie
   navyse, bloky "warn" upozornuju na miesto, kde sa appka
   odklonila od zosita. Vsetky otazky su pisane, ako na pisomke.
   ============================================================ */

/* ===== TEMY ===== */
var TOPICS = [
  {title:"Štát a moc",           short:"Štát a neštát, znaky štátu, štátna moc, koncentrácia a deľba moci"},
  {title:"Občianstvo a územie",  short:"Ako sa získa občianstvo, čo patrí k územiu, anexia, cesia, akcesia"},
  {title:"Suverenita a symboly", short:"Vnútorná a vonkajšia suverenita, vlajka, znak, hymna, pečať"},
  {title:"Typy štátov",          short:"Forma vlády, územno-organizačné členenie, štátny režim"}
];

/* ===== LEKCIE =====
   b   - obsah lekcie: h (nadpis casti), p (odsek), rows (pojem - vyznam), list, powers, figs, tip, extra, warn
   qs  - otazky, vsetky pisane:
         txt   - napis kratku odpoved; acc su uznane tvary, kw su skupiny klucovych slov
                 (staci, ked je v odpovedi z kazdej skupiny aspon jedno)
         def   - napis vlastnymi slovami, co nieco znamena (kontroluju sa klucove slova)
         list  - vymenuj n veci v lubovolnom poradi; polozka je pole uznanych tvarov alebo {s, kw}
         pairs - viac poli s popisom, ku kazdemu jedna odpoved */
var LESSONS = [
/* ---------- 1. STAT A MOC ---------- */
{t:0, h:"Štát a štátna moc",
 b:[
  {t:"h", x:"Štát a neštát"},
  {t:"rows", r:[["štát","status civilis"],["neštát","status naturalis"]]},
  {t:"h", x:"4 znaky štátu"},
  {t:"list", num:true, li:["<b>štátna moc</b>","<b>štátne občianstvo</b>","<b>štátne územie</b>","<b>suverenita</b> (zvrchovanosť)"]},
  {t:"h", x:"Štátna moc"},
  {t:"p", x:"Štátna moc je <b>identifikovateľná mocenská štruktúra</b>. Patrí k nej:"},
  {t:"rows", r:[
    ["zdroj moci","všeobecne uznávaný"],
    ["legitimita moci","zdôvodnenie, prečo vládne práve ten, kto vládne; je zhora alebo zdola"],
    ["stratifikácia spoločnosti","hierarchia, ktorá vychádza z deľby práce"],
    ["distribúcia moci","spôsob vlády"]
  ]},
  {t:"extra", x:"Legitimita <b>zhora</b>: moc je napríklad od Boha alebo zdedená. Legitimita <b>zdola</b>: moc vládnucim dali ľudia, napríklad vo voľbách."},
  {t:"tip", x:"<b>Civilis</b> ako civilizácia: ľudia žijú podľa pravidiel štátu. <b>Naturalis</b> ako príroda: štát nie je, je to prirodzený stav."}
 ],
 qs:[
  {t:"pairs", q:"Napíš latinské názvy.", rows:[{l:"štát", acc:["status civilis"]},{l:"neštát", acc:["status naturalis"]}]},
  {t:"list", q:"Vymenuj 4 znaky štátu.", n:4,
   items:[["štátna moc","moc"],["štátne občianstvo","občianstvo"],["štátne územie","územie"],["suverenita","zvrchovanosť","suverenita štátu"]]},
  {t:"def", q:"Napíš, čo je štátna moc.", kw:[["mocensk"],["struktur"]], sol:"identifikovateľná mocenská štruktúra"},
  {t:"list", q:"Vymenuj 4 veci, ktoré patria k štátnej moci.", n:4,
   items:[["zdroj moci","všeobecne uznávaný zdroj moci","zdroj"],["legitimita moci","legitimita"],["stratifikácia spoločnosti","stratifikácia"],["distribúcia moci","distribúcia"]]},
  {t:"def", q:"Napíš, čo znamená legitimita moci.", kw:[["zdovodn","preco","dovod"],["vlad"]], sol:"zdôvodnenie, prečo vládne práve ten, kto vládne"},
  {t:"list", q:"Povedz, aká môže byť legitimita moci (obe možnosti).", n:2, items:[["zhora","z hora","zvrchu"],["zdola","z dola","zospodu"]]},
  {t:"def", q:"Napíš, čo znamená stratifikácia spoločnosti.", kw:[["hierarch"]], sol:"hierarchia, ktorá vychádza z deľby práce"},
  {t:"def", q:"Napíš, čo znamená distribúcia moci.", kw:[["sposob"],["vlad"]], sol:"spôsob vlády"}
 ]},

{t:0, h:"Koncentrácia a deľba moci",
 b:[
  {t:"p", x:"Distribúcia moci (spôsob vlády) je buď <b>koncentrácia moci</b>, alebo <b>deľba moci</b>."},
  {t:"h", x:"Koncentrácia moci"},
  {t:"list", li:["absolutizmus","despotizmus","diktatúra","totalitarizmus (inak <b>totalita moci</b>)","monopol na moc"]},
  {t:"h", x:"Deľba moci"},
  {t:"list", li:["teokracia","aristokracia","oligarchia","demokracia","pluralizmus moci","checks and balances"]},
  {t:"extra", x:"<b>Checks and balances</b> sa po slovensky hovorí brzdy a protiváhy: zložky moci sa navzájom kontrolujú."},
  {t:"h", x:"Horizontálna deľba moci"},
  {t:"powers"},
  {t:"tip", x:"<b>Legislatíva</b> robí zákony. <b>Exekutíva</b> ich vykonáva (po anglicky <i>execute</i>). <b>Justícia</b> súdi (<i>justice</i> = spravodlivosť)."}
 ],
 qs:[
  {t:"list", q:"Vymenuj aspoň 3 formy koncentrácie moci.", n:3,
   items:[["absolutizmus"],["despotizmus"],["diktatúra"],["totalitarizmus","totalita moci","totalita"],["monopol na moc","monopol moci"]]},
  {t:"list", q:"Vymenuj aspoň 3 formy deľby moci.", n:3,
   items:[["teokracia"],["aristokracia"],["oligarchia"],["demokracia"],["pluralizmus moci","pluralizmus"],["checks and balances"]]},
  {t:"txt", q:"Ako sa inak volá totalitarizmus?", acc:["totalita moci"]},
  {t:"pairs", q:"Ako sa volá táto moc cudzím slovom?",
   rows:[{l:"zákonodarná moc", acc:["legislatíva"]},{l:"výkonná moc", acc:["exekutíva"]},{l:"súdna moc", acc:["justícia"]}]},
  {t:"pairs", q:"Napíš, čo znamená:",
   rows:[{l:"legislatíva", kw:[["zakonodar","zakony","zakon"]], s:"zákonodarná moc"},
         {l:"exekutíva", kw:[["vykon"]], s:"výkonná moc"},
         {l:"justícia", kw:[["sudn","sud"]], s:"súdna moc"}]},
  {t:"txt", q:"Kto má na Slovensku zákonodarnú moc?",
   acc:["NR SR","Národná rada SR","Národná rada Slovenskej republiky","Národná rada","parlament","parlament NR SR","NRSR"], sol:"parlament – NR SR"},

/* kazda otazka dostane id "lekcia-poradie"; polozky zoznamov a riadky sa zjednotia */
var QS = [], QBYID = {};
function normItem(it){
  if(Array.isArray(it)){ return {s:it[0], acc:it, kw:null}; }
  return {s:it.s || (it.acc ? it.acc[0] : ""), acc:it.acc || [], kw:it.kw || null};
}
(function indexQuestions(){
  var li, k, src, it;
  for(li = 0; li < LESSONS.length; li++){
    for(k = 0; k < LESSONS[li].qs.length; k++){
      src = LESSONS[li].qs[k];
      if(src.items){ src.items = src.items.map(normItem); }
      if(src.rows){ src.rows = src.rows.map(function(r){ var n = normItem(r); n.l = r.l; return n; }); }
      it = {id:li + "-" + k, li:li, src:src};
      QS.push(it);
      QBYID[it.id] = it;
    }
  }
})();
function qsOf(li){ return QS.filter(function(x){ return x.li === li; }); }
function lessonsOf(ti){
  var out = [], i;
  for(i = 0; i < LESSONS.length; i++){ if(LESSONS[i].t === ti){ out.push(i); } }
  return out;
}
function topicQs(ti){ return QS.filter(function(x){ return LESSONS[x.li].t === ti; }); }

/* ===== POKROK =====
   pri kazdej otazke: ok = posledna odpoved bola spravna, b = kolkokrat za sebou spravne,
   last = poradie, kedy sa na nu naposledy pytal (aby sa z minuleho uciva striedali otazky) */
var KEY = "polit-pokrok-v3";
var P = {q:{}, done:{}, tick:0, best:null, sound:true};
var OLD_PER_LESSON = 2;

function loadProgress(){
  try {
    var raw = window.localStorage.getItem(KEY);
    if(!raw){ return; }
    var o = JSON.parse(raw);
    if(o && typeof o === "object"){
      if(o.q && typeof o.q === "object"){ P.q = o.q; }
      if(o.done && typeof o.done === "object"){ P.done = o.done; }
      if(typeof o.tick === "number"){ P.tick = o.tick; }
      if(o.best && typeof o.best === "object"){ P.best = o.best; }
      if(o.sound === false){ P.sound = false; }
    }
  } catch(err){ /* bez ulozeneho pokroku appka funguje dalej */ }
}
function saveProgress(){
  try { window.localStorage.setItem(KEY, JSON.stringify(P)); }
  catch(err){ /* sukromne okno alebo plne ulozisko */ }
}
function qState(id){
  var s = P.q[id];
  if(!s){ return "new"; }
  return s.ok ? "know" : "learn";
}
function record(id, ok){
  var s = P.q[id] || {ok:false, b:0, n:0, last:0};
  P.tick++;
  P.q[id] = {ok:ok, b:ok ? s.b + 1 : 0, n:s.n + 1, last:P.tick};
  saveProgress();
}
function nextLesson(){
  var i;
  for(i = 0; i < LESSONS.length; i++){ if(!P.done[i]){ return i; } }
  return -1;
}
function doneCount(){
  var n = 0, i;
  for(i = 0; i < LESSONS.length; i++){ if(P.done[i]){ n++; } }
  return n;
}
function answered(list){ return list.filter(function(x){ return !!P.q[x.id]; }); }
/* najprv otazky, ktore naposledy nevedel, potom tie, na ktore sa najdlhsie nepytal */
function weakest(list){
  return list.slice().sort(function(x, y){
    var a = P.q[x.id], b = P.q[y.id];
    return ((a.ok ? 1 : 0) - (b.ok ? 1 : 0)) || (a.b - b.b) || (a.last - b.last);
  });
}

/* ===== ZVUK (Web Audio, ziadne subory) ===== */
var ac = null;
function ensureAudio(){
  if(!ac){
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(err){ ac = null; }
  }
  if(ac && ac.state === "suspended"){ ac.resume(); }
}
function beep(freq, dur, type, vol, delay){
  if(!P.sound){ return; }
  ensureAudio();
  if(!ac){ return; }
  var t = ac.currentTime + (delay || 0);
  var osc = ac.createOscillator();
  var gain = ac.createGain();
  osc.type = type || "sine";
  osc.frequency.setValueAtTime(freq, t);
  gain.gain.setValueAtTime(vol || 0.06, t);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(gain);
  gain.connect(ac.destination);
  osc.start(t);
  osc.stop(t + dur + 0.03);
}

/* ===== POMOCNE FUNKCIE ===== */
function shuffle(arr){
  var i, j, tmp;
  for(i = arr.length - 1; i > 0; i--){
    j = Math.floor(Math.random() * (i + 1));
    tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}
/* male pismena, bez diakritiky, bez interpunkcie */
function norm(s){
  s = (s === null || s === undefined) ? "" : String(s);
  s = s.toLowerCase().trim();
  if(s.normalize){ s = s.normalize("NFD").replace(/[̀-ͯ]/g, ""); }
  s = s.replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
  return s;
}
function lev(a, b){
  var m = a.length, n = b.length, i, j, prev, cur, tmp;
  if(m === 0){ return n; }
  if(n === 0){ return m; }
  prev = [];
  for(j = 0; j <= n; j++){ prev[j] = j; }
  for(i = 1; i <= m; i++){
    cur = [i];
    for(j = 1; j <= n; j++){
      tmp = (a.charAt(i - 1) === b.charAt(j - 1)) ? 0 : 1;
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + tmp);
    }
    prev = cur;
  }
  return prev[n];
}
function accExact(val, acc){
  var v = norm(val), i;
  if(!v){ return false; }
  for(i = 0; i < acc.length; i++){ if(v === norm(acc[i])){ return true; } }
  return false;
}
/* presna zhoda alebo maly preklep (dlhsie slova znesu viac); zaciatok slova musi sediet,
   inak by "symetricke" preslo ako "asymetricke" a "centralizovane" ako "decentralizovane" */
function accOk(val, acc){
  var v = norm(val), i, a;
  if(!v){ return false; }
  for(i = 0; i < acc.length; i++){
    a = norm(acc[i]);
    if(v === a){ return true; }
    if(v.slice(0, 2) !== a.slice(0, 2)){ continue; }
    if(a.length > 5 && lev(v, a) <= 1){ return true; }
    if(a.length > 11 && lev(v, a) <= 2){ return true; }
  }
  return false;
}
/* klucove slova: z kazdej skupiny musi byt v odpovedi aspon jedno */
function kwOk(val, kw){
  var v = norm(val), i, j, hit;
  if(!v || !kw || !kw.length){ return false; }
  for(i = 0; i < kw.length; i++){
    hit = false;
    for(j = 0; j < kw[i].length; j++){ if(v.indexOf(kw[i][j]) >= 0){ hit = true; } }
    if(!hit){ return false; }
  }
  return true;
}
function itemOk(val, it){ return accOk(val, it.acc || []) || kwOk(val, it.kw); }
/* zoznam: kazde policko sa priradi inej veci (najvacsie parovanie, aby jedna odpoved nezabrala miesto inej) */
function listMatch(vals, items){
  var ok = [], ownerOf = [], res = [], i, j;
  for(i = 0; i < vals.length; i++){
    ok.push([]);
    for(j = 0; j < items.length; j++){ ok[i].push(!!norm(vals[i]) && itemOk(vals[i], items[j])); }
  }
  for(j = 0; j < items.length; j++){ ownerOf.push(-1); }
  function tryAssign(i, seen){
    for(var j2 = 0; j2 < items.length; j2++){
      if(!ok[i][j2] || seen[j2]){ continue; }
      seen[j2] = true;
      if(ownerOf[j2] < 0 || tryAssign(ownerOf[j2], seen)){ ownerOf[j2] = i; return true; }
    }
    return false;
  }
  for(i = 0; i < vals.length; i++){ tryAssign(i, {}); }
  for(i = 0; i < vals.length; i++){ res.push(-1); }
  for(j = 0; j < items.length; j++){ if(ownerOf[j] >= 0){ res[ownerOf[j]] = j; } }
  return res;
}
function esc(s){
  return String(s === null || s === undefined ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function gradeOf(pct){
  if(pct >= 90){ return 1; }
  if(pct >= 75){ return 2; }
  if(pct >= 50){ return 3; }
  if(pct >= 30){ return 4; }
  return 5;
}
function gradeWord(g){ return ["", "výborný", "chválitebný", "dobrý", "dostatočný", "nedostatočný"][g]; }
function plural(n, one, few, many){ return n === 1 ? one : (n >= 2 && n <= 4 ? few : many); }

function prepare(x){
  var src = x.src;
  return {id:x.id, li:x.li, t:src.t, q:src.q, e:src.e || "", acc:src.acc || [], kw:src.kw || null,
    sol:src.sol || (src.acc ? src.acc[0] : ""), n:src.n || 0, items:src.items || [], rows:src.rows || []};
}
function blankAns(q){
  var a = [], i, k = q.t === "list" ? q.n : (q.t === "pairs" ? q.rows.length : 1);
  for(i = 0; i < k; i++){ a.push(""); }
  return a;
}
function fieldOk(q, a){
  /* pre kazde policko: je spravne? */
  var res, i, out = [];
  if(q.t === "list"){
    res = listMatch(a, q.items);
    for(i = 0; i < q.n; i++){ out.push(res[i] >= 0); }
    return out;
  }
  if(q.t === "pairs"){
    for(i = 0; i < q.rows.length; i++){ out.push(itemOk(a[i], q.rows[i])); }
    return out;
  }
  return [accOk(a[0], q.acc) || kwOk(a[0], q.kw)];
}
function isOk(q, a){
  var f = fieldOk(q, a), i;
  for(i = 0; i < f.length; i++){ if(!f[i]){ return false; } }
  return true;
}
function solText(q){
  if(q.t === "list"){
    var all = q.items.map(function(it){ return it.s; });
    return (q.n === q.items.length ? "" : "stačí " + q.n + " z týchto: ") + all.join(", ");
  }
  if(q.t === "pairs"){ return q.rows.map(function(r){ return r.l + ' – <b>' + esc(r.s) + '</b>'; }).join("<br>"); }
  return '<b>' + esc(q.sol) + '</b>';
}
function yourText(q, a){
  if(q.t === "pairs"){ return q.rows.map(function(r, i){ return r.l + ': ' + (esc(String(a[i]).trim()) || "–"); }).join("<br>"); }
  return a.map(function(x){ return esc(String(x).trim()) || "–"; }).join(", ");
}

/* ===== PRIEBEH =====
   lekcia: vsetky otazky z lekcie, po kazdej tretej jedna z predoslych lekcii
   (vzdy aspon jedna z lekcie tesne pred nou); co nevedel, pride este raz na konci */
function buildLesson(li){
  var own = qsOf(li), olds = [], Q = [], prev, rest, i, oi = 0;
  prev = li > 0 ? weakest(answered(qsOf(li - 1))) : [];
  if(prev.length){ olds.push(prev[0].id); }
  rest = weakest(answered(QS.filter(function(x){ return x.li < li && olds.indexOf(x.id) < 0; })));
  for(i = 0; i < rest.length && olds.length < OLD_PER_LESSON; i++){ olds.push(rest[i].id); }
  for(i = 0; i < own.length; i++){
    Q.push({id:own[i].id, role:"new"});
    if((i + 1) % 3 === 0 && oi < olds.length){ Q.push({id:olds[oi], role:"old"}); oi++; }
  }
  while(oi < olds.length){ Q.push({id:olds[oi], role:"old"}); oi++; }
  return Q;
}
function newRun(kind, li, ti, Q){
  S.run = {kind:kind, li:li, ti:ti, queue:Q, i:0, q:null, ans:null, locked:false, ok:false, note:"",
    snap:null, added:-1, reasked:{}, log:[]};
  enterStep();
  S.screen = "run";
  render();
}
function startLesson(li){ newRun("lesson", li, LESSONS[li].t, buildLesson(li)); }
function startReview(ti){
  var pool = ti < 0 ? QS : topicQs(ti), list = weakest(answered(pool)).slice(0, 10);
  if(!list.length){ return; }
  newRun("review", -1, ti, shuffle(list).map(function(x){ return {id:x.id, role:"old"}; }));
}
/* pisomka: otazky zo vsetkych tem striedavo */
function startTest(){
  var pools = [], order = [], out = [], i, any = true;
  for(i = 0; i < TOPICS.length; i++){
    pools.push(shuffle(topicQs(i)));
    order.push(i);
  }
  while(out.length < S.cnt && any){
    any = false;
    shuffle(order);
    for(i = 0; i < order.length && out.length < S.cnt; i++){
      if(pools[order[i]].length){ out.push({id:pools[order[i]].pop().id, role:"test"}); any = true; }
    }
  }
  newRun("test", -1, -1, shuffle(out));
}
function enterStep(){
  var R = S.run;
  R.q = prepare(QBYID[R.queue[R.i].id]);
  R.ans = blankAns(R.q);
  R.locked = false; R.ok = false; R.note = ""; R.snap = null; R.added = -1;
}
function lockRun(){
  var R = S.run, q = R.q, ok = isOk(q, R.ans);
  R.locked = true;
  R.ok = ok;
  R.log.push({q:q, ans:R.ans, ok:ok});
  if(ok){ sGood(); } else { sBad(); }
  if(R.kind !== "test"){
    R.snap = P.q[q.id] ? JSON.parse(JSON.stringify(P.q[q.id])) : null;
    record(q.id, ok);
    if(!ok && !R.reasked[q.id]){
      R.reasked[q.id] = true;
      R.queue.push({id:q.id, role:"retry"});
      R.added = R.queue.length - 1;
      R.note = "Na konci sa ťa na to spýtam ešte raz.";
    } else if(!ok){
      R.note = R.kind === "lesson" ? "Vrátim sa k tomu v ďalšej lekcii." : "Vrátim sa k tomu pri ďalšom opakovaní.";
    }
  }
  renderRun(false);
}
/* odpoved bola dobre, len inymi slovami: oprava hodnotenia */
function overrideRun(){
  var R = S.run, q = R.q;
  if(!R.locked || R.ok){ return; }
  R.ok = true;
  R.log[R.log.length - 1].ok = true;
  if(R.kind !== "test"){
    if(R.snap){ P.q[q.id] = R.snap; } else { delete P.q[q.id]; }
    record(q.id, true);
    if(R.added >= 0){ R.queue.splice(R.added, 1); delete R.reasked[q.id]; R.added = -1; }
  }
  R.note = "";
  sGood();
  renderRun(false);
}
function nextStep(){
  var R = S.run;
  if(R.i >= R.queue.length - 1){ finishRun(); return; }
  R.i++;
  enterStep();
  renderRun(true);
}
function finishRun(){
  var R = S.run, correct = 0, i, pct;
  for(i = 0; i < R.log.length; i++){ if(R.log[i].ok){ correct++; } }
  if(R.kind === "lesson"){ P.done[R.li] = true; saveProgress(); }
  if(R.kind === "test" && R.log.length){
    pct = Math.round((correct / R.log.length) * 100);
    if(!P.best || pct > P.best.pct){ P.best = {pct:pct, grade:gradeOf(pct)}; }
    saveProgress();
  }
  sWin();
  S.screen = R.kind === "test" ? "testend" : "lessonend";
  render();
}

    html += '<div class="label">Celé učivo</div><h1>Všetkých ' + total + ' lekcií máš za sebou</h1>' +
      '<p class="muted">Teraz už len opakuj. Najprv prídu otázky, ktoré ti idú najmenej.</p>' +
      '<button class="btn" data-act="review" data-val="-1">Opakovať všetko ' + IC.arrow + '</button>';
  }
  html += '<div class="stack tight"><div class="lbar"><span style="width:' + Math.round((done / total) * 100) + '%"></span></div>' +
    '<span class="small muted">Hotové lekcie: ' + done + ' z ' + total + '</span></div>';
  if(nl >= 0 && any){
    html += '<button class="btn soft" data-act="review" data-val="-1">Zopakovať, čo som sa už učil</button>';
  }
  html += '</div>';

  html += '<div class="box"><h3>Písomka nanečisto</h3>' +
    '<p class="muted">Otázky zo všetkých lekcií pomiešané, ako u učiteľa. Na konci dostaneš známku.</p>' +
    (P.best ? '<p class="small">Najlepšie: <b>známka ' + P.best.grade + '</b> (' + P.best.pct + ' %)</p>' : '') +
    '<div class="tabs">';
  [10, 15, 25].forEach(function(n){
    html += '<button class="tab' + (S.cnt === n ? " on" : "") + '" data-act="cnt" data-val="' + n + '">' + n + ' otázok</button>';
  });
  html += '</div><button class="btn ghost" data-act="test">Spustiť písomku</button></div>';
  html += '</div>';

  html += '<div class="topics"><div class="top" style="min-height:0;padding-bottom:8px;"><span class="label">Témy</span><div class="sp"></div><span class="small muted">bodka = jedna otázka</span></div>';
  TOPICS.forEach(function(t, i){
    var ls = lessonsOf(i), tq = topicQs(i);
    html += '<button class="trow" data-act="topic" data-val="' + i + '"><span class="tn">' + (i + 1) + '</span>' +
      '<span class="tb"><span class="tt">' + t.title + '</span>' + dotsHtml(tq) +
      '<span class="small muted">vieš ' + countKnow(tq) + ' z ' + tq.length + ' otázok · ' + (ls.length === 1 ? 'lekcia ' + (ls[0] + 1) : 'lekcie ' + (ls[0] + 1) + ' – ' + (ls[ls.length - 1] + 1)) + '</span></span>' + IC.chev + '</button>';
  });
  html += '<div class="legend"><span><span class="dot k"></span>vieš</span><span><span class="dot l"></span>naposledy zle</span><span><span class="dot"></span>ešte nebola</span></div>';
  html += '<p class="foot" style="margin-top:20px;">Najprv si prečítaš celú lekciu, potom ťa z nej vyskúšam a pridám aj otázky z predošlých lekcií. ' +
    'Všetky otázky sú písané, ako na písomke. Pokrok sa ukladá len v tomto prehliadači. ' +
    (any || P.best ? '<button class="linkbtn" data-act="reset">Vymazať pokrok</button>' : '') + '</p>';
  html += '</div></div></div>';
  app.innerHTML = html;
}

function viewTopic(){
  var t = TOPICS[S.ti], ls = lessonsOf(S.ti), nl = nextLesson(), any = answered(topicQs(S.ti)).length > 0, html;
  html = '<div class="wrap">' +
    '<div class="top"><button class="back" data-act="home">' + IC.back + 'Domov</button><div class="sp"></div>' + soundBtn() + '</div>' +
    '<div class="stack tight"><span class="label">Téma ' + (S.ti + 1) + ' z ' + TOPICS.length + '</span><h1>' + t.title + '</h1><p class="muted">' + t.short + '</p></div>';
  if(any){ html += '<button class="btn" data-act="review" data-val="' + S.ti + '">Precvičiť túto tému ' + IC.arrow + '</button>'; }
  html += '<div class="topics"><div class="label" style="padding-bottom:8px;">Lekcie</div>';
  ls.forEach(function(li){
    var lq = qsOf(li), pill = P.done[li] ? '<span class="pill k">hotová</span>' : (li === nl ? '<span class="pill l">ďalšia</span>' : '');
    html += '<button class="crow" data-act="open" data-val="' + li + '"><span class="cb"><span class="ct">' + (li + 1) + '. ' + LESSONS[li].h + '</span>' +
      '<span class="cs">vieš ' + countKnow(lq) + ' z ' + lq.length + ' otázok</span></span>' + pill + IC.chev + '</button>';
  });
  html += '</div></div>';
  app.innerHTML = html;
}

function viewLesson(){
  var L = LESSONS[S.li], n = qsOf(S.li).length, html;
  html = '<div class="wrap flow">' +
    '<div class="top"><button class="back" data-act="home">' + IC.back + 'Domov</button><div class="sp"></div>' + soundBtn() + '</div>' +
    '<div class="stack tight"><span class="label">Lekcia ' + (S.li + 1) + ' z ' + LESSONS.length + ' · ' + TOPICS[L.t].title + '</span><h1>' + L.h + '</h1></div>' +
    '<div class="stack">' + lessonBody(L) + '</div>' +
    '<div class="dock"><button class="btn" data-act="lesson" data-val="' + S.li + '">Mám prečítané, vyskúšaj ma ' + IC.arrow + '</button>' +
    '<div class="small muted center">' + n + ' ' + plural(n, "otázka", "otázky", "otázok") + ' z tejto lekcie' +
    (S.li > 0 && answered(QS.filter(function(x){ return x.li < S.li; })).length ? ' a ' + OLD_PER_LESSON + ' z predošlých' : '') + '</div></div></div>';
  app.innerHTML = html;
}

/* --- otazky --- */
function renderRun(fresh){
  var R = S.run, total = R.queue.length, pct = Math.round(((R.i + (R.locked ? 1 : 0)) / total) * 100), html, label;
  label = R.kind === "test" ? "Ukončiť písomku" : (R.kind === "lesson" ? "Ukončiť lekciu" : "Ukončiť opakovanie");
  html = '<div class="wrap flow">' +
    '<div class="ftop"><button class="ibtn" data-act="quit" aria-label="' + label + '">' + IC.close + '</button>' +
    '<div class="prog"><span style="width:' + pct + '%"></span></div><span class="cnt">' + (R.i + 1) + ' / ' + total + '</span></div>' +
    questionHtml() + '</div>';
  app.innerHTML = html;
  if(fresh){ window.scrollTo(0, 0); focusFirst(); }
  else if(R.locked){
    var nb = document.getElementById("mainbtn");
    if(nb && nb.scrollIntoView){ nb.scrollIntoView({block:"nearest", behavior:"smooth"}); }
  }
}
function focusFirst(){
  var el = document.getElementById("in0");
  if(el && !el.disabled && window.matchMedia && window.matchMedia("(hover:hover)").matches){ el.focus(); }
}
function inputHtml(id, val, L, cls, enter){
  return '<input class="txtin' + cls + '" id="' + id + '" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="' + enter + '"' +
    (L ? ' disabled value="' + esc(val) + '"' : '') + '>';
}
function questionHtml(){
  var R = S.run, q = R.q, a = R.ans, L = R.locked, role = R.queue[R.i].role, html = "", i, f = L ? fieldOk(q, a) : [], tag, cls, last;
  if(R.kind === "test"){ tag = "písomka"; }
  else if(R.kind === "review"){ tag = "opakovanie"; }
  else { tag = role === "old" ? "z predošlej lekcie" : (role === "retry" ? "ešte raz" : "z tejto lekcie"); }
  html += '<div class="stack tight"><div class="kick"><span class="a">' + KIND[q.t] + '</span><span class="sep">·</span><span>' + LESSONS[q.li].h + '</span><span class="tag">' + tag + '</span></div>' +
    '<h2>' + q.q + '</h2></div>';

  html += '<div class="stack">';
  if(q.t === "txt"){
    html += inputHtml("in0", a[0], L, L ? (f[0] ? " okin" : " badin") : "", "done");
  } else if(q.t === "def"){
    html += '<textarea class="txtin' + (L ? (f[0] ? " okin" : " badin") : "") + '" id="in0" rows="2" enterkeyhint="done" placeholder="Napíš vlastnými slovami"' + (L ? ' disabled' : '') + '>' + esc(a[0]) + '</textarea>';
  } else if(q.t === "list"){
    for(i = 0; i < q.n; i++){
      last = i === q.n - 1;
      html += '<div class="inrow"><span class="ix">' + (i + 1) + '</span>' + inputHtml("in" + i, a[i], L, L ? (f[i] ? " okin" : " badin") : "", last ? "done" : "next") + '</div>';
    }
  } else if(q.t === "pairs"){
    for(i = 0; i < q.rows.length; i++){
      last = i === q.rows.length - 1;
      html += '<div class="field"><label for="in' + i + '">' + q.rows[i].l + '</label>' + inputHtml("in" + i, a[i], L, L ? (f[i] ? " okin" : " badin") : "", last ? "done" : "next") + '</div>';
    }
  }
  if(!L){ html += '<div class="hint2">' + HINT[q.t] + '</div>'; }
  html += '</div>';

  if(L){
    html += '<div class="fb ' + (R.ok ? "ok" : "no") + '"><span class="head">' + (R.ok ? "Správne" : "Nie celkom") + '</span>' +
      (R.ok ? '' : '<span>Správne je: ' + solText(q) + '</span>') +
      (q.e ? '<span>' + q.e + '</span>' : '') +
      (R.ok ? '' : '<button class="linkbtn" data-act="override">Mal som to správne, len inými slovami</button>') + '</div>';
  }

  html += '<div class="dock">';
  if(L){
    if(R.note){ html += '<div class="srs">' + IC.again + '<span>' + R.note + '</span></div>'; }
    html += '<button class="btn" data-act="next" id="mainbtn">' + (R.i >= R.queue.length - 1 ? (R.kind === "test" ? "Vyhodnotiť písomku" : (R.kind === "lesson" ? "Dokončiť lekciu" : "Dokončiť opakovanie")) : 'Ďalej ' + IC.arrow) + '</button>';
  } else {
    html += '<button class="btn" data-act="check" id="mainbtn">Skontrolovať</button>';
  }
  html += '</div>';
  return html;
}

function missesHtml(log){
  var html = "", i, it;
  for(i = 0; i < log.length; i++){
    it = log[i];
    if(it.ok){ continue; }
    html += '<div class="miss"><span class="mq">' + it.q.q + '</span>' +
      '<span>Tvoja odpoveď:<br><span class="yours">' + yourText(it.q, it.ans) + '</span></span>' +
      '<span>Správne:<br><span class="right">' + solText(it.q) + '</span></span></div>';
  }
  return html;
}
/* v lekcii sa zle zodpovedana otazka opakuje; do vysledku ide posledna odpoved na kazdu otazku */
function finalLog(log){
  var lastOf = {}, out = [], i;
  for(i = 0; i < log.length; i++){ lastOf[log[i].q.id] = i; }
  for(i = 0; i < log.length; i++){ if(lastOf[log[i].q.id] === i){ out.push(log[i]); } }
  return out;
}
function viewLessonEnd(){
  var R = S.run, fl = finalLog(R.log), correct = 0, nl = nextLesson(), html, firstTry = 0, seen = {}, i;
  for(i = 0; i < fl.length; i++){ if(fl[i].ok){ correct++; } }
  for(i = 0; i < R.log.length; i++){
    if(!seen[R.log[i].q.id]){ seen[R.log[i].q.id] = true; if(R.log[i].ok){ firstTry++; } }
  }
  html = '<div class="wrap">' +
    '<div class="top"><div class="sp"></div>' + soundBtn() + '</div>' +
    '<div class="stack tight"><span class="label">' + (R.kind === "lesson" ? "Lekcia " + (R.li + 1) + " hotová" : "Opakovanie hotové") + '</span>' +
    '<h1>Na prvý raz ' + firstTry + ' z ' + fl.length + ' správne</h1>' +
    '<p class="muted">' + (correct > firstTry ? 'Po oprave na konci máš správne ' + correct + ' z ' + fl.length + '. ' : '') +
    (R.kind === "lesson" ? 'Hotové lekcie: ' + doneCount() + ' z ' + LESSONS.length + '.' : '') + '</p></div>';
  html += '<div class="stack">';
  if(R.kind === "lesson" && nl >= 0){
    html += '<button class="btn" data-act="open" data-val="' + nl + '">Ďalšia lekcia: ' + LESSONS[nl].h + ' ' + IC.arrow + '</button>';
  } else if(R.kind === "lesson"){
    html += '<button class="btn" data-act="review" data-val="-1">Opakovať všetko ' + IC.arrow + '</button>';
  } else {
    html += '<button class="btn" data-act="review" data-val="' + R.ti + '">Opakovať ešte ' + IC.arrow + '</button>';
  }
  html += '<button class="btn ghost" data-act="home">Domov</button></div>';
  if(correct < fl.length){
    html += '<div><h2 style="margin-bottom:6px;">Toto si ešte nevedel</h2><p class="muted small" style="margin-bottom:8px;">Spýtam sa ťa na to znova v ďalšej lekcii alebo pri opakovaní.</p>' + missesHtml(fl) + '</div>';
  }
  html += '</div>';
  app.innerHTML = html;
  window.scrollTo(0, 0);
}
function viewTestEnd(){
  var R = S.run, total = R.log.length, correct = 0, i, pct, g, html;
  for(i = 0; i < total; i++){ if(R.log[i].ok){ correct++; } }
  pct = total ? Math.round((correct / total) * 100) : 0;
  g = gradeOf(pct);
  html = '<div class="wrap">' +
    '<div class="top"><div class="sp"></div>' + soundBtn() + '</div>' +
    '<div class="stack"><span class="label center">Písomka nanečisto</span><div class="grade">' + g + '</div>' +
    '<p class="center"><b>' + gradeWord(g) + '</b></p>' +
    '<div class="stats"><div class="stat"><b>' + pct + ' %</b>úspešnosť</div><div class="stat"><b>' + correct + '</b>správne</div><div class="stat"><b>' + (total - correct) + '</b>chyby</div></div>' +
    '<p class="small muted center">Známka: od 90 % = 1, od 75 % = 2, od 50 % = 3, od 30 % = 4</p></div>' +
    '<div class="stack"><button class="btn" data-act="test">Nová písomka</button><button class="btn ghost" data-act="home">Domov</button></div>';
  if(correct < total){ html += '<div><h2 style="margin-bottom:6px;">Chyby</h2>' + missesHtml(R.log) + '</div>'; }
  html += '</div>';
  app.innerHTML = html;
  window.scrollTo(0, 0);
}
function viewCheat(){
  var html = '<div class="wrap">' +
    '<div class="top"><button class="back" data-act="home">' + IC.back + 'Domov</button></div>' +
    '<div class="stack tight"><span class="label">Ťahák</span><h1>Všetko na jednom mieste</h1></div>';
  TOPICS.forEach(function(t, ti){
    html += '<div class="stack tight"><h2>' + (ti + 1) + '. ' + t.title + '</h2><div class="ch">';
    lessonsOf(ti).forEach(function(li){ html += cheatHtml(LESSONS[li]); });
    html += '</div></div>';
  });
  html += '</div>';
  app.innerHTML = html;
}
/* tahak: kazda cast lekcie (od nadpisu po nadpis) ako jeden riadok */
function cheatHtml(L){
  var html = "", title = L.h, parts = [];
  function flush(){ if(parts.length){ html += '<div class="ci"><h3>' + title + '</h3><div>' + parts.join("<br>") + '</div></div>'; } parts = []; }
  L.b.forEach(function(b){
    if(b.t === "h"){ flush(); title = b.x; }
    else if(b.t === "p"){ parts.push(b.x); }
    else if(b.t === "rows"){ parts.push(b.r.map(function(r){ return '<b>' + r[0] + '</b>' + (r[1] ? ' – ' + r[1] : ''); }).join(" · ")); }
    else if(b.t === "list"){ parts.push(b.li.join(" · ")); }
    else if(b.t === "powers"){ parts.push("<b>legislatíva</b> – zákonodarná – NR SR · <b>exekutíva</b> – výkonná – prezident + vláda SR · <b>justícia</b> – súdna – Ústavný a Najvyšší súd SR"); }
  });
  flush();
  return html;
}

function render(){
  if(S.screen === "home"){ viewHome(); }
  else if(S.screen === "topic"){ viewTopic(); }
  else if(S.screen === "lessonpage"){ viewLesson(); }
  else if(S.screen === "run"){ renderRun(true); return; }
  else if(S.screen === "lessonend"){ viewLessonEnd(); return; }
  else if(S.screen === "testend"){ viewTestEnd(); return; }
  else if(S.screen === "cheat"){ viewCheat(); }
  window.scrollTo(0, 0);
}

/* ===== OVLADANIE ===== */
app.addEventListener("click", function(ev){
  var el = ev.target;
  while(el && el !== app && !(el.getAttribute && el.getAttribute("data-act"))){ el = el.parentNode; }
  if(!el || el === app || el.disabled){ return; }
  handle(el.getAttribute("data-act"), el.getAttribute("data-val"));
});
/* Enter v policku: dalsie policko, v poslednom kontrola */
app.addEventListener("keydown", function(ev){
  var t = ev.target, m, nx;
  if(ev.key !== "Enter" || ev.shiftKey){ return; }
  if(!t || !t.classList || !t.classList.contains("txtin")){ return; }
  ev.preventDefault();
  m = /^in(\d+)$/.exec(t.id || "");
  nx = m ? document.getElementById("in" + (parseInt(m[1], 10) + 1)) : null;
  if(nx && !nx.disabled){ nx.focus(); return; }
  handle("check");
});
/* Enter mimo policka (na pocitaci): Dalej */
document.addEventListener("keydown", function(ev){
  var t = ev.target, btn;
  if(ev.key !== "Enter" || S.screen !== "run"){ return; }
  if(t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "BUTTON")){ return; }
  btn = document.getElementById("mainbtn");
  if(btn && !btn.disabled){ ev.preventDefault(); btn.click(); }
});

function handle(act, val){
  var R = S.run, q, i, el, vals;
  if(act === "home"){ S.screen = "home"; render(); return; }
  if(act === "sound"){
    P.sound = !P.sound; saveProgress();
    if(P.sound){ ensureAudio(); }
    if(S.screen === "run"){ renderRun(false); } else { render(); }
    return;
  }
  if(act === "topic"){ S.ti = parseInt(val, 10); S.screen = "topic"; render(); return; }
  if(act === "open"){ S.li = parseInt(val, 10); S.screen = "lessonpage"; render(); return; }
  if(act === "cheat"){ S.screen = "cheat"; render(); return; }
  if(act === "cnt"){ S.cnt = parseInt(val, 10); render(); return; }
  if(act === "lesson"){ ensureAudio(); startLesson(parseInt(val, 10)); return; }
  if(act === "review"){ ensureAudio(); startReview(parseInt(val, 10)); return; }
  if(act === "test"){ ensureAudio(); startTest(); return; }
  if(act === "reset"){
    if(window.confirm("Naozaj vymazať celý pokrok?")){ P.q = {}; P.done = {}; P.tick = 0; P.best = null; saveProgress(); render(); }
    return;
  }
  if(act === "quit"){
    if(R && R.kind === "test" && R.log.length && !window.confirm("Písomka ešte nie je dokončená. Naozaj ju chceš ukončiť?")){ return; }
    S.screen = "home"; render(); return;
  }
  if(!R || S.screen !== "run"){ return; }
  if(act === "next"){ if(R.locked){ nextStep(); } return; }
  if(act === "override"){ overrideRun(); return; }
  if(act === "check"){
    if(R.locked){ return; }
    q = R.q;
    vals = [];
    for(i = 0; i < R.ans.length; i++){ el = document.getElementById("in" + i); vals.push(el ? el.value : ""); }
    if(!vals.join("").replace(/\s/g, "")){ el = document.getElementById("in0"); if(el){ el.focus(); } return; }
    R.ans = vals;
    lockRun();
  }
}

loadProgress();
render();

/* offline: po prvom otvoreni sa appka ulozi do telefonu */
if("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){ /* bez offline rezimu appka funguje dalej */ });
  });
}
</script>
</body>

<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Politológia – štát a typy štátov</title>
<meta name="description" content="Učebná appka z politológie (9. ročník): štát, moc, občianstvo, územie, suverenita, symboly a typy štátov. Lekcie s písanými otázkami a písomka nanečisto.">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Politológia">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
  /* svetly vzhlad s jasnou hierarchiou:
     zlte zvyraznenie = uci sa na pisomku, modry ramcek = vysvetlenie jednoduchymi slovami,
     sive a mensie = navyse; kazda tema ma svoju farbu (--tc) */
  :root{
    --bg:#f2f4f8;
    --card:#ffffff;
    --soft:#f5f6f8;
    --line:#e2e6ee;
    --ink:#12141a;
    --muted:#5d6577;
    --faint:#9aa1ae;
    --hl:#ffe27a;
    --easy:#eef4fd;
    --easy-line:#d3e1f7;
    --easy-ink:#1f4fae;
    --tip:#fff8e1;
    --tip-line:#f0d98e;
    --tip-ink:#7a5300;
    --ok:#13803b;
    --ok-soft:#e8f6ed;
    --ok-ink:#0e5f2c;
    --bad:#c52a1f;
    --bad-soft:#fcedeb;
    --leg:#2349d8;
    --exe:#b45309;
    --jus:#0f766e;
    --tc:#2349d8;
    --tsoft:#eaf0ff;
    --tink:#1a36a6;
    --font:"Figtree", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;}
  .wrap{
    max-width:680px;margin:0 auto;min-height:100vh;
    padding:12px max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left));
    padding-top:max(12px, env(safe-area-inset-top));
    display:flex;flex-direction:column;gap:16px;
  }
  .wrap.flow{padding-bottom:0;}
  h1{font-size:28px;font-weight:700;line-height:1.15;letter-spacing:-.5px;margin:0;text-wrap:balance;}
  h2{font-size:21px;font-weight:700;line-height:1.25;letter-spacing:-.2px;margin:0;text-wrap:balance;}
  h3{font-size:18px;font-weight:700;line-height:1.3;margin:0;}
  p{margin:0;}
  b{font-weight:700;}
  .muted{color:var(--muted);}
  .small{font-size:14px;}
  .label{font-size:12.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);}
  .stack{display:flex;flex-direction:column;gap:12px;}
  .stack.tight{gap:6px;}
  .center{text-align:center;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 1px 3px rgba(18,20,26,.05);display:flex;flex-direction:column;gap:14px;}
  .tpill{align-self:flex-start;font-size:13px;font-weight:700;padding:5px 11px;border-radius:999px;background:var(--tsoft);color:var(--tink);}

  /* ---- tlacidla ---- */
  .btn{
    display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    min-height:54px;padding:8px 18px;border:none;border-radius:14px;cursor:pointer;
    background:var(--tc);color:#fff;font-size:17px;font-weight:700;text-align:center;line-height:1.25;
  }
  .btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--ink);min-height:50px;font-size:16px;}
  .btn.soft{background:var(--card);color:var(--ink);border:1px solid var(--line);min-height:50px;font-size:16px;}
  .btn svg{flex:0 0 auto;}
  .ibtn{
    flex:0 0 44px;width:44px;height:44px;border-radius:12px;border:none;background:transparent;
    display:flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer;
  }
  .ibtn.out{border:1px solid var(--line);background:var(--card);}
  .tbtn{
    height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);
    display:flex;align-items:center;gap:6px;color:var(--ink);font-weight:700;font-size:15px;cursor:pointer;
  }
  .linkbtn{background:none;border:none;padding:0;font:inherit;color:var(--muted);text-decoration:underline;cursor:pointer;}
  .back{
    height:44px;padding:0 12px 0 4px;margin-left:-6px;border:none;background:transparent;border-radius:10px;
    display:flex;align-items:center;gap:4px;font-weight:700;font-size:15px;color:var(--ink);cursor:pointer;
  }

  /* ---- hlavicka ---- */
  .top{display:flex;align-items:center;gap:8px;min-height:44px;}
  .top .sp{flex:1;}
  .brand{display:flex;flex-direction:column;line-height:1.3;}
  .brand b{font-size:18px;font-weight:800;letter-spacing:-.2px;}
  .brand span{font-size:13px;color:var(--muted);}

  /* ---- domov ---- */
  .homegrid{display:flex;flex-direction:column;gap:16px;}
  .lbar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;}
  .lbar span{display:block;height:8px;background:var(--tc);border-radius:999px;}
  .tcard{flex-direction:row;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;color:var(--ink);font-size:16px;padding:16px;}
  .tbadge{flex:0 0 40px;height:40px;border-radius:12px;background:var(--tc);color:#fff;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;}
  .tcard .tb{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;}
  .tcard .tt{font-weight:700;font-size:17px;line-height:1.25;}
  .tcard .ts{font-size:14px;color:var(--muted);line-height:1.35;}
  .chev{flex:0 0 18px;color:var(--faint);}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;}
  .tab{
    height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);
    font-size:14.5px;font-weight:700;color:var(--ink);cursor:pointer;
  }
  .tab.on{background:var(--ink);border-color:var(--ink);color:#fff;}
  .foot{font-size:13.5px;color:var(--muted);line-height:1.5;padding:0 4px;}

  /* ---- obsah lekcie ---- */
  .sechead{display:flex;align-items:center;gap:10px;}
  .secn{flex:0 0 32px;height:32px;border-radius:10px;background:var(--tc);color:#fff;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;}
  .lc b{background:linear-gradient(transparent 50%, var(--hl) 50%);padding:0 2px;border-radius:2px;-webkit-box-decoration-break:clone;box-decoration-break:clone;}
  .lc p, .lc .pts{font-size:16.5px;line-height:1.55;}
  .rows{display:flex;flex-direction:column;}
  .rows .r{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;padding:12px 0;border-top:1px solid var(--line);}
  .rows .r:first-child{border-top:none;padding-top:2px;}
  .rows .r .k{flex:0 0 auto;font-size:16px;font-weight:800;padding:3px 10px;border-radius:9px;background:var(--tsoft);color:var(--tink);}
  .rows .r .v{flex:1 1 200px;min-width:0;font-size:16.5px;line-height:1.5;}
  .pts{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;}
  .pts li::marker{color:var(--tc);font-weight:800;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{font-size:16px;font-weight:700;padding:7px 13px;border-radius:999px;background:var(--tsoft);color:var(--tink);}
  .easy{background:var(--easy);border:1px solid var(--easy-line);border-radius:14px;padding:12px 14px;font-size:15.5px;line-height:1.55;}
  .easy .nl, .tipbox .nl{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;margin-bottom:4px;}
  .easy .nl{color:var(--easy-ink);}
  .lc .easy b{background:none;padding:0;color:#173f8c;}
  .tipbox{background:var(--tip);border:1px solid var(--tip-line);border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.5;}
  .tipbox .nl{color:var(--tip-ink);}
  .lc .tipbox b{background:none;padding:0;}
  .extra{border:1px dashed #c6ccd6;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.5;color:var(--muted);}
  .extra .nl{display:block;font-size:12px;font-weight:700;margin-bottom:2px;}
  .lc .extra b{background:none;padding:0;}
  .warn{background:#fff1e6;border:1px solid #f6c9a4;border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.5;}
  .warn .nl{display:block;font-size:12.5px;font-weight:800;color:#8a3f06;margin-bottom:2px;}
  .lc .warn b{background:none;padding:0;}
  .legend2{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;}
  .legend2 .es{background:var(--easy);border:1px solid var(--easy-line);color:var(--easy-ink);font-weight:700;border-radius:6px;padding:0 6px;}
  .must{border:2px solid var(--tc);}
  .mlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;}
  .mlist li{display:flex;gap:10px;align-items:flex-start;font-size:16px;line-height:1.5;}
  .mlist li svg{flex:0 0 20px;margin-top:2px;color:var(--tc);}
  .powers{display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:8px;}
  .pw{border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:3px;background:#eef2fd;}
  .pw.exe{background:#fdf1e2;}
  .pw.jus{background:#e3f4f1;}
  .pw .pn{font-weight:800;font-size:16px;color:var(--leg);line-height:1.2;}
  .pw.exe .pn{color:var(--exe);}
  .pw.jus .pn{color:var(--jus);}
  .pw .pk{font-size:13.5px;color:var(--ink);font-weight:600;line-height:1.3;}
  .pw .pi{font-size:14px;color:var(--muted);line-height:1.3;margin-top:4px;}
  .figs{display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap;}
  .figs figure{margin:0;display:flex;flex-direction:column;gap:6px;align-items:flex-start;}
  .figs figcaption{font-size:13px;color:var(--muted);}

  /* ---- otazky ---- */
  .ftop{display:flex;align-items:center;gap:12px;min-height:44px;}
  .ftop .ibtn{margin-left:-10px;}
  .prog{flex:1;height:8px;border-radius:999px;background:var(--line);overflow:hidden;}
  .prog span{display:block;height:8px;background:var(--tc);border-radius:999px;transition:width .3s ease;}
  .cnt{font-size:13.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .kick{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;font-size:13px;font-weight:600;color:var(--muted);}
  .kick .tag{margin-left:auto;}
  .dock{
    position:-webkit-sticky;position:sticky;bottom:0;z-index:5;margin-top:auto;
    display:flex;flex-direction:column;gap:10px;background:var(--bg);
    padding:12px 0 max(20px, env(safe-area-inset-bottom));
  }
  .srs{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45;color:var(--muted);}
  .srs svg{flex:0 0 18px;margin-top:1px;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:15.5px;font-weight:700;line-height:1.35;}
  .inrow{display:flex;gap:12px;align-items:center;}
  .inrow .ix{flex:0 0 16px;font-weight:800;color:var(--tc);font-variant-numeric:tabular-nums;}
  .txtin{
    flex:1;min-width:0;width:100%;height:54px;padding:0 14px;border-radius:12px;border:1.5px solid #cfd4dc;background:var(--card);
    font-family:inherit;font-size:18px;font-weight:500;color:var(--ink);outline:none;
  }
  textarea.txtin{height:auto;min-height:92px;padding:12px 14px;line-height:1.45;resize:vertical;}
  .txtin:focus{border-color:var(--tc);box-shadow:0 0 0 3px var(--tsoft);}
  .txtin.okin{border-color:var(--ok);background:var(--ok-soft);}
  .txtin.badin{border-color:var(--bad);background:var(--bad-soft);}
  .txtin:disabled{opacity:1;-webkit-text-fill-color:var(--ink);}
  .hint2{font-size:14px;color:var(--muted);}
  .fb{border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;font-size:15.5px;line-height:1.5;}
  .fb.ok{background:var(--ok-soft);border:1px solid #bfe3cb;}
  .fb.no{background:var(--bad-soft);border:1px solid #f2c4bf;}
  .fb .head{font-weight:800;font-size:16.5px;}
  .fb.ok .head{color:var(--ok-ink);}
  .fb.no .head{color:var(--bad);}
  .fb .linkbtn{align-self:flex-start;color:var(--ink);font-size:14.5px;}

  /* ---- vysledky ---- */
  .grade{font-size:96px;font-weight:800;line-height:1;letter-spacing:-3px;text-align:center;color:var(--tc);}
  .stats{display:flex;justify-content:center;gap:28px;}
  .stat{display:flex;flex-direction:column;align-items:center;font-size:13.5px;color:var(--muted);}
  .stat b{font-size:24px;color:var(--ink);font-variant-numeric:tabular-nums;}
  .miss{padding:14px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;font-size:15px;}
  .miss:first-of-type{border-top:none;padding-top:0;}
  .miss .mq{font-weight:700;font-size:16px;}
  .miss .yours{color:var(--bad);}
  .miss .right{color:var(--ok-ink);}

  @media (hover:hover){
    .btn:hover{filter:brightness(.92);}
    .btn.ghost:hover, .btn.soft:hover{filter:none;background:var(--soft);}
    .tcard:hover{border-color:var(--tc);}
    .tab:hover, .tbtn:hover{border-color:var(--ink);}
  }
  button:focus-visible, .txtin:focus-visible{outline:3px solid var(--tc);outline-offset:2px;}
  @media (min-width:900px){
    .wrap.home{max-width:1080px;}
    .homegrid{display:grid;grid-template-columns:minmax(0, 1fr) minmax(0, 1fr);gap:24px;align-items:start;}
    .wrap{padding-top:28px;}
    .wrap.flow .dock{padding-bottom:28px;}
  }
  @media (max-width:380px){
    .powers{grid-template-columns:1fr;}
  }
  @media (prefers-reduced-motion:reduce){
    .prog span{transition:none;}
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============================================================
   UCEBNA APLIKACIA - POLITOLOGIA: STAT A TYPY STATOV
   Obsah je zo skolskeho zosita. Bloky "extra" su dovysvetlenie
   navyse, bloky "warn" upozornuju na miesto, kde sa appka
   odklonila od zosita. Vsetky otazky su pisane, ako na pisomke.
   ============================================================ */

/* ===== TEMY ===== */
var TOPICS = [
  {title:"Štát a moc",           short:"Štát a neštát, znaky štátu, štátna moc, koncentrácia a deľba moci"},
  {title:"Občianstvo a územie",  short:"Ako sa získa občianstvo, čo patrí k územiu, anexia, cesia, akcesia"},
  {title:"Suverenita a symboly", short:"Vnútorná a vonkajšia suverenita, vlajka, znak, hymna, pečať"},
  {title:"Typy štátov",          short:"Forma vlády, územno-organizačné členenie, štátny režim"}
];

/* ===== LEKCIE =====
   b   - obsah lekcie: h (nadpis casti), p (odsek), rows (pojem - vyznam), list, powers, figs, tip, extra, warn
   qs  - otazky, vsetky pisane:
         txt   - napis kratku odpoved; acc su uznane tvary, kw su skupiny klucovych slov
                 (staci, ked je v odpovedi z kazdej skupiny aspon jedno)
         def   - napis vlastnymi slovami, co nieco znamena (kontroluju sa klucove slova)
         list  - vymenuj n veci v lubovolnom poradi; polozka je pole uznanych tvarov alebo {s, kw}
         pairs - viac poli s popisom, ku kazdemu jedna odpoved */
var LESSONS = [
/* ---------- 1. STAT A MOC ---------- */
{t:0, h:"Štát a štátna moc",
 b:[
  {t:"h", x:"Štát a neštát"},
  {t:"rows", r:[["štát","<b>status civilis</b>"],["neštát","<b>status naturalis</b>"]]},
  {t:"easy", x:"<b>Status civilis</b> (občiansky stav): ľudia žijú v štáte podľa spoločných pravidiel a zákonov. <b>Status naturalis</b> (prirodzený stav): štát nie je, nikto nevládne a každý sa stará sám o seba."},
  {t:"tip", x:"<b>Civilis</b> ako civilizácia, <b>naturalis</b> ako príroda."},
  {t:"h", x:"4 znaky štátu"},
  {t:"list", num:true, li:["<b>štátna moc</b>","<b>štátne občianstvo</b>","<b>štátne územie</b>","<b>suverenita</b> (zvrchovanosť)"]},
  {t:"easy", x:"Aby bol niečo štát, musí mať všetky štyri: niekoho, kto vládne (moc), ľudí, ktorí k nemu patria (občania), svoje územie, a musí si sám rozhodovať (suverenita)."},
  {t:"h", x:"Štátna moc"},
  {t:"p", x:"Štátna moc je <b>identifikovateľná mocenská štruktúra</b>. Patrí k nej:"},
  {t:"rows", r:[
    ["zdroj moci","<b>všeobecne uznávaný</b>"],
    ["legitimita moci","<b>zdôvodnenie, prečo vládne práve ten, kto vládne</b>; je <b>zhora</b> alebo <b>zdola</b>"],
    ["stratifikácia spoločnosti","<b>hierarchia</b>, ktorá vychádza z <b>deľby práce</b>"],
    ["distribúcia moci","<b>spôsob vlády</b>"]
  ]},
  {t:"easy", x:"<b>Identifikovateľná mocenská štruktúra</b> = dá sa jasne určiť, kto v štáte vládne a kto komu velí.<br><b>Zdroj moci</b> = ľudia uznávajú, odkiaľ má vláda moc.<br><b>Legitimita</b> = dôvod, prečo ľudia súhlasia, že vládne práve on. <b>Zhora</b>: moc mu dal niekto „nad“ ľuďmi, napríklad Boh, alebo ju zdedil. <b>Zdola</b>: moc mu dali ľudia, napríklad vo voľbách.<br><b>Stratifikácia</b> = spoločnosť je rozdelená na vrstvy ako poschodia, niekto je vyššie a niekto nižšie. Vzniká to tak, že ľudia robia rôzne práce (riaditeľ, lekár, robotník) a podľa toho majú rôzne postavenie.<br><b>Distribúcia moci</b> = ako je moc rozdelená: či ju má jeden, alebo viacerí."}
 ],
 must:[
  "štát = <b>status civilis</b>, neštát = <b>status naturalis</b>",
  "4 znaky štátu: <b>štátna moc, občianstvo, územie, suverenita</b>",
  "štátna moc = <b>identifikovateľná mocenská štruktúra</b>",
  "legitimita = <b>zdôvodnenie, prečo vládne ten, kto vládne</b> (zhora alebo zdola)",
  "stratifikácia = <b>hierarchia z deľby práce</b>, distribúcia = <b>spôsob vlády</b>"

 ],
 qs:[
  {t:"pairs", q:"Napíš latinské názvy.", rows:[{l:"štát", acc:["status civilis"]},{l:"neštát", acc:["status naturalis"]}]},
  {t:"list", q:"Vymenuj 4 znaky štátu.", n:4,
   items:[["štátna moc","moc"],["štátne občianstvo","občianstvo"],["štátne územie","územie"],["suverenita","zvrchovanosť","suverenita štátu"]]},
  {t:"def", q:"Napíš, čo je štátna moc.", kw:[["mocensk"],["struktur"]], sol:"identifikovateľná mocenská štruktúra"},
  {t:"list", q:"Vymenuj 4 veci, ktoré patria k štátnej moci.", n:4,
   items:[["zdroj moci","všeobecne uznávaný zdroj moci","zdroj"],["legitimita moci","legitimita"],["stratifikácia spoločnosti","stratifikácia"],["distribúcia moci","distribúcia"]]},
  {t:"def", q:"Napíš, čo znamená legitimita moci.", kw:[["zdovodn","preco","dovod"],["vlad"]], sol:"zdôvodnenie, prečo vládne práve ten, kto vládne"},
  {t:"list", q:"Povedz, aká môže byť legitimita moci (obe možnosti).", n:2, items:[["zhora","z hora","zvrchu"],["zdola","z dola","zospodu"]]},
  {t:"def", q:"Napíš, čo znamená stratifikácia spoločnosti.", kw:[["hierarch"]], sol:"hierarchia, ktorá vychádza z deľby práce"},

  {t:"chips", li:["teokracia","aristokracia","oligarchia","demokracia","pluralizmus moci","checks and balances"]},

  {t:"h", x:"Horizontálna deľba moci"},
  {t:"powers"},
  {t:"easy", x:"Moc je rozdelená na tri časti, aby ju nemal nikto celú: jedni zákony <b>robia</b>, druhí ich <b>vykonávajú</b> a tretí <b>súdia</b>, či sa dodržiavajú."},

 ],

/* ===== POKROK =====
   pri kazdej otazke: ok = posledna odpoved bola spravna, b = kolkokrat za sebou spravne,
   last = poradie, kedy sa na nu naposledy pytal (aby sa z minuleho uciva striedali otazky) */
var KEY = "polit-pokrok-v3";
var P = {q:{}, done:{}, tick:0, best:null, sound:true};
var OLD_PER_LESSON = 2;

function loadProgress(){
  try {
    var raw = window.localStorage.getItem(KEY);
    if(!raw){ return; }
    var o = JSON.parse(raw);
    if(o && typeof o === "object"){
      if(o.q && typeof o.q === "object"){ P.q = o.q; }
      if(o.done && typeof o.done === "object"){ P.done = o.done; }
      if(typeof o.tick === "number"){ P.tick = o.tick; }
      if(o.best && typeof o.best === "object"){ P.best = o.best; }
      if(o.sound === false){ P.sound = false; }
    }
  } catch(err){ /* bez ulozeneho pokroku appka funguje dalej */ }
}
function saveProgress(){
  try { window.localStorage.setItem(KEY, JSON.stringify(P)); }
  catch(err){ /* sukromne okno alebo plne ulozisko */ }
}
function qState(id){
  var s = P.q[id];
  if(!s){ return "new"; }
  return s.ok ? "know" : "learn";
}
function record(id, ok){
  var s = P.q[id] || {ok:false, b:0, n:0, last:0};
  P.tick++;
  P.q[id] = {ok:ok, b:ok ? s.b + 1 : 0, n:s.n + 1, last:P.tick};
  saveProgress();
}
function nextLesson(){
  var i;
  for(i = 0; i < LESSONS.length; i++){ if(!P.done[i]){ return i; } }
  return -1;
}
function doneCount(){
  var n = 0, i;
  for(i = 0; i < LESSONS.length; i++){ if(P.done[i]){ n++; } }
  return n;
}
function answered(list){ return list.filter(function(x){ return !!P.q[x.id]; }); }
/* najprv otazky, ktore naposledy nevedel, potom tie, na ktore sa najdlhsie nepytal */
function weakest(list){
  return list.slice().sort(function(x, y){
    var a = P.q[x.id], b = P.q[y.id];
    return ((a.ok ? 1 : 0) - (b.ok ? 1 : 0)) || (a.b - b.b) || (a.last - b.last);
  });
}

/* ===== ZVUK (Web Audio, ziadne subory) ===== */
var ac = null;
function ensureAudio(){
  if(!ac){
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(err){ ac = null; }
  }
  if(ac && ac.state === "suspended"){ ac.resume(); }
}
function beep(freq, dur, type, vol, delay){
  if(!P.sound){ return; }
  ensureAudio();
  if(!ac){ return; }
  var t = ac.currentTime + (delay || 0);
  var osc = ac.createOscillator();
  var gain = ac.createGain();
  osc.type = type || "sine";
  osc.frequency.setValueAtTime(freq, t);
  gain.gain.setValueAtTime(vol || 0.06, t);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(gain);
  gain.connect(ac.destination);
  osc.start(t);
  osc.stop(t + dur + 0.03);
}

function sBad(){ beep(220, 0.22, "triangle", 0.07); }

/* ===== POMOCNE FUNKCIE ===== */
function shuffle(arr){
  var i, j, tmp;
  for(i = arr.length - 1; i > 0; i--){
    j = Math.floor(Math.random() * (i + 1));
    tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}
/* male pismena, bez diakritiky, bez interpunkcie */
function norm(s){
  s = (s === null || s === undefined) ? "" : String(s);
  s = s.toLowerCase().trim();
  if(s.normalize){ s = s.normalize("NFD").replace(/[̀-ͯ]/g, ""); }
  s = s.replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
  return s;
}
function lev(a, b){
  var m = a.length, n = b.length, i, j, prev, cur, tmp;
  if(m === 0){ return n; }
  if(n === 0){ return m; }
  prev = [];
  for(j = 0; j <= n; j++){ prev[j] = j; }
  for(i = 1; i <= m; i++){
    cur = [i];
    for(j = 1; j <= n; j++){
      tmp = (a.charAt(i - 1) === b.charAt(j - 1)) ? 0 : 1;
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + tmp);
    }
    prev = cur;
  }
  return prev[n];
}
function accExact(val, acc){
  var v = norm(val), i;
  if(!v){ return false; }
  for(i = 0; i < acc.length; i++){ if(v === norm(acc[i])){ return true; } }
  return false;
}
/* presna zhoda alebo maly preklep (dlhsie slova znesu viac); zaciatok slova musi sediet,
   inak by "symetricke" preslo ako "asymetricke" a "centralizovane" ako "decentralizovane" */
function accOk(val, acc){
  var v = norm(val), i, a;
  if(!v){ return false; }
  for(i = 0; i < acc.length; i++){
    a = norm(acc[i]);
    if(v === a){ return true; }
    if(v.slice(0, 2) !== a.slice(0, 2)){ continue; }
    if(a.length > 5 && lev(v, a) <= 1){ return true; }
    if(a.length > 11 && lev(v, a) <= 2){ return true; }
  }
  return false;
}
/* klucove slova: z kazdej skupiny musi byt v odpovedi aspon jedno */
function kwOk(val, kw){
  var v = norm(val), i, j, hit;
  if(!v || !kw || !kw.length){ return false; }
  for(i = 0; i < kw.length; i++){
    hit = false;
    for(j = 0; j < kw[i].length; j++){ if(v.indexOf(kw[i][j]) >= 0){ hit = true; } }
    if(!hit){ return false; }
  }
  return true;
}
function itemOk(val, it){ return accOk(val, it.acc || []) || kwOk(val, it.kw); }
/* zoznam: kazde policko sa priradi inej veci (najvacsie parovanie, aby jedna odpoved nezabrala miesto inej) */
function listMatch(vals, items){
  var ok = [], ownerOf = [], res = [], i, j;
  for(i = 0; i < vals.length; i++){
    ok.push([]);
    for(j = 0; j < items.length; j++){ ok[i].push(!!norm(vals[i]) && itemOk(vals[i], items[j])); }
  }
  for(j = 0; j < items.length; j++){ ownerOf.push(-1); }
  function tryAssign(i, seen){
    for(var j2 = 0; j2 < items.length; j2++){
      if(!ok[i][j2] || seen[j2]){ continue; }
      seen[j2] = true;
      if(ownerOf[j2] < 0 || tryAssign(ownerOf[j2], seen)){ ownerOf[j2] = i; return true; }
    }
    return false;
  }
  for(i = 0; i < vals.length; i++){ tryAssign(i, {}); }
  for(i = 0; i < vals.length; i++){ res.push(-1); }
  for(j = 0; j < items.length; j++){ if(ownerOf[j] >= 0){ res[ownerOf[j]] = j; } }
  return res;
}
function esc(s){
  return String(s === null || s === undefined ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function gradeOf(pct){
  if(pct >= 90){ return 1; }
  if(pct >= 75){ return 2; }
  if(pct >= 50){ return 3; }
  if(pct >= 30){ return 4; }
  return 5;
}
function gradeWord(g){ return ["", "výborný", "chválitebný", "dobrý", "dostatočný", "nedostatočný"][g]; }
function plural(n, one, few, many){ return n === 1 ? one : (n >= 2 && n <= 4 ? few : many); }

function prepare(x){
  var src = x.src;
  return {id:x.id, li:x.li, t:src.t, q:src.q, e:src.e || "", acc:src.acc || [], kw:src.kw || null,
    sol:src.sol || (src.acc ? src.acc[0] : ""), n:src.n || 0, items:src.items || [], rows:src.rows || []};
}
function blankAns(q){
  var a = [], i, k = q.t === "list" ? q.n : (q.t === "pairs" ? q.rows.length : 1);
  for(i = 0; i < k; i++){ a.push(""); }
  return a;
}
function fieldOk(q, a){
  /* pre kazde policko: je spravne? */
  var res, i, out = [];
  if(q.t === "list"){
    res = listMatch(a, q.items);
    for(i = 0; i < q.n; i++){ out.push(res[i] >= 0); }
    return out;
  }
  if(q.t === "pairs"){
    for(i = 0; i < q.rows.length; i++){ out.push(itemOk(a[i], q.rows[i])); }
    return out;
  }
  return [accOk(a[0], q.acc) || kwOk(a[0], q.kw)];
}
function isOk(q, a){
  var f = fieldOk(q, a), i;
  for(i = 0; i < f.length; i++){ if(!f[i]){ return false; } }
  return true;
}
function solText(q){
  if(q.t === "list"){
    var all = q.items.map(function(it){ return it.s; });
    return (q.n === q.items.length ? "" : "stačí " + q.n + " z týchto: ") + all.join(", ");
  }
  if(q.t === "pairs"){ return q.rows.map(function(r){ return r.l + ' – <b>' + esc(r.s) + '</b>'; }).join("<br>"); }
  return '<b>' + esc(q.sol) + '</b>';
}
function yourText(q, a){
  if(q.t === "pairs"){ return q.rows.map(function(r, i){ return r.l + ': ' + (esc(String(a[i]).trim()) || "–"); }).join("<br>"); }
  return a.map(function(x){ return esc(String(x).trim()) || "–"; }).join(", ");
}

/* ===== PRIEBEH =====
   lekcia: vsetky otazky z lekcie, po kazdej tretej jedna z predoslych lekcii
   (vzdy aspon jedna z lekcie tesne pred nou); co nevedel, pride este raz na konci */
function buildLesson(li){
  var own = qsOf(li), olds = [], Q = [], prev, rest, i, oi = 0;
  prev = li > 0 ? weakest(answered(qsOf(li - 1))) : [];
  if(prev.length){ olds.push(prev[0].id); }
  rest = weakest(answered(QS.filter(function(x){ return x.li < li && olds.indexOf(x.id) < 0; })));
  for(i = 0; i < rest.length && olds.length < OLD_PER_LESSON; i++){ olds.push(rest[i].id); }
  for(i = 0; i < own.length; i++){
    Q.push({id:own[i].id, role:"new"});
    if((i + 1) % 3 === 0 && oi < olds.length){ Q.push({id:olds[oi], role:"old"}); oi++; }
  }
  while(oi < olds.length){ Q.push({id:olds[oi], role:"old"}); oi++; }
  return Q;
}
function newRun(kind, li, ti, Q){
  S.run = {kind:kind, li:li, ti:ti, queue:Q, i:0, q:null, ans:null, locked:false, ok:false, note:"",
    snap:null, added:-1, reasked:{}, log:[]};
  enterStep();
  S.screen = "run";
  render();
}
function startLesson(li){ newRun("lesson", li, LESSONS[li].t, buildLesson(li)); }
function startReview(ti){
  var pool = ti < 0 ? QS : topicQs(ti), list = weakest(answered(pool)).slice(0, 10);
  if(!list.length){ return; }
  newRun("review", -1, ti, shuffle(list).map(function(x){ return {id:x.id, role:"old"}; }));
}
/* pisomka: otazky zo vsetkych tem striedavo */
function startTest(){
  var pools = [], order = [], out = [], i, any = true;
  for(i = 0; i < TOPICS.length; i++){
    pools.push(shuffle(topicQs(i)));
    order.push(i);
  }
  while(out.length < S.cnt && any){
    any = false;
    shuffle(order);
    for(i = 0; i < order.length && out.length < S.cnt; i++){
      if(pools[order[i]].length){ out.push({id:pools[order[i]].pop().id, role:"test"}); any = true; }
    }
  }
  newRun("test", -1, -1, shuffle(out));
}
function enterStep(){
  var R = S.run;
  R.q = prepare(QBYID[R.queue[R.i].id]);
  R.ans = blankAns(R.q);
  R.locked = false; R.ok = false; R.note = ""; R.snap = null; R.added = -1;
}
function lockRun(){
  var R = S.run, q = R.q, ok = isOk(q, R.ans);
  R.locked = true;
  R.ok = ok;
  R.log.push({q:q, ans:R.ans, ok:ok});
  if(ok){ sGood(); } else { sBad(); }
  if(R.kind !== "test"){
    R.snap = P.q[q.id] ? JSON.parse(JSON.stringify(P.q[q.id])) : null;
    record(q.id, ok);
    if(!ok && !R.reasked[q.id]){
      R.reasked[q.id] = true;
      R.queue.push({id:q.id, role:"retry"});
      R.added = R.queue.length - 1;
      R.note = "Na konci sa ťa na to spýtam ešte raz.";
    } else if(!ok){
      R.note = R.kind === "lesson" ? "Vrátim sa k tomu v ďalšej lekcii." : "Vrátim sa k tomu pri ďalšom opakovaní.";
    }
  }
  renderRun(false);
}
/* odpoved bola dobre, len inymi slovami: oprava hodnotenia */
function overrideRun(){
  var R = S.run, q = R.q;
  if(!R.locked || R.ok){ return; }
  R.ok = true;
  R.log[R.log.length - 1].ok = true;
  if(R.kind !== "test"){
    if(R.snap){ P.q[q.id] = R.snap; } else { delete P.q[q.id]; }
    record(q.id, true);
    if(R.added >= 0){ R.queue.splice(R.added, 1); delete R.reasked[q.id]; R.added = -1; }
  }
  R.note = "";
  sGood();
  renderRun(false);
}
function nextStep(){
  var R = S.run;
  if(R.i >= R.queue.length - 1){ finishRun(); return; }
  R.i++;
  enterStep();
  renderRun(true);
}
function finishRun(){
  var R = S.run, correct = 0, i, pct;
  for(i = 0; i < R.log.length; i++){ if(R.log[i].ok){ correct++; } }
  if(R.kind === "lesson"){ P.done[R.li] = true; saveProgress(); }
  if(R.kind === "test" && R.log.length){
    pct = Math.round((correct / R.log.length) * 100);
    if(!P.best || pct > P.best.pct){ P.best = {pct:pct, grade:gradeOf(pct)}; }
    saveProgress();
  }
  sWin();
  S.screen = R.kind === "test" ? "testend" : "lessonend";
  render();
}

    html += inputHtml("in0", a[0], L, L ? (f[0] ? " okin" : " badin") : "", "done");
  } else if(q.t === "def"){
    html += '<textarea class="txtin' + (L ? (f[0] ? " okin" : " badin") : "") + '" id="in0" rows="2" enterkeyhint="done" placeholder="Napíš vlastnými slovami"' + (L ? ' disabled' : '') + '>' + esc(a[0]) + '</textarea>';
  } else if(q.t === "list"){
    for(i = 0; i < q.n; i++){
      last = i === q.n - 1;
      html += '<div class="inrow"><span class="ix">' + (i + 1) + '</span>' + inputHtml("in" + i, a[i], L, L ? (f[i] ? " okin" : " badin") : "", last ? "done" : "next") + '</div>';
    }
  } else if(q.t === "pairs"){
    for(i = 0; i < q.rows.length; i++){
      last = i === q.rows.length - 1;
      html += '<div class="field"><label for="in' + i + '">' + q.rows[i].l + '</label>' + inputHtml("in" + i, a[i], L, L ? (f[i] ? " okin" : " badin") : "", last ? "done" : "next") + '</div>';
    }
  }
  if(!L){ html += '<div class="hint2">' + HINT[q.t] + '</div>'; }
  html += '</div></div>';

  if(L){
    html += '<div class="fb ' + (R.ok ? "ok" : "no") + '"><span class="head">' + (R.ok ? "Správne" : "Nie celkom") + '</span>' +
      (R.ok ? '' : '<span>Správne je: ' + solText(q) + '</span>') +
      (q.e ? '<span>' + q.e + '</span>' : '') +
      (R.ok ? '' : '<button class="linkbtn" data-act="override">Mal som to správne, len inými slovami</button>') + '</div>';
  }

  html += '<div class="dock">';
  if(L){
    if(R.note){ html += '<div class="srs">' + IC.again + '<span>' + R.note + '</span></div>'; }
    html += '<button class="btn" data-act="next" id="mainbtn">' + (R.i >= R.queue.length - 1 ? (R.kind === "test" ? "Vyhodnotiť písomku" : (R.kind === "lesson" ? "Dokončiť lekciu" : "Dokončiť opakovanie")) : 'Ďalej ' + IC.arrow) + '</button>';
  } else {
    html += '<button class="btn" data-act="check" id="mainbtn">Skontrolovať</button>';
  }
  html += '</div>';
  return html;
}

function missesHtml(log){
  var html = "", i, it;
  for(i = 0; i < log.length; i++){
    it = log[i];
    if(it.ok){ continue; }
    html += '<div class="miss"><span class="mq">' + it.q.q + '</span>' +
      '<span>Tvoja odpoveď:<br><span class="yours">' + yourText(it.q, it.ans) + '</span></span>' +
      '<span>Správne:<br><span class="right">' + solText(it.q) + '</span></span></div>';
  }
  return html;
}
/* v lekcii sa zle zodpovedana otazka opakuje; do vysledku ide posledna odpoved na kazdu otazku */
function finalLog(log){
  var lastOf = {}, out = [], i;
  for(i = 0; i < log.length; i++){ lastOf[log[i].q.id] = i; }
  for(i = 0; i < log.length; i++){ if(lastOf[log[i].q.id] === i){ out.push(log[i]); } }
  return out;
}
function viewLessonEnd(){
  var R = S.run, fl = finalLog(R.log), correct = 0, nl = nextLesson(), html, firstTry = 0, seen = {}, i;
  for(i = 0; i < fl.length; i++){ if(fl[i].ok){ correct++; } }
  for(i = 0; i < R.log.length; i++){
    if(!seen[R.log[i].q.id]){ seen[R.log[i].q.id] = true; if(R.log[i].ok){ firstTry++; } }
  }
  html = '<div class="wrap" style="' + tvars(R.li >= 0 ? LESSONS[R.li].t : (R.ti >= 0 ? R.ti : 0)) + '">' +
    '<div class="top"><div class="sp"></div>' + soundBtn() + '</div>' +
    '<div class="card"><span class="tpill">' + (R.kind === "lesson" ? "Lekcia " + (R.li + 1) + " hotová" : "Opakovanie hotové") + '</span>' +
    '<h1>Na prvý raz ' + firstTry + ' z ' + fl.length + ' správne</h1>' +
    '<p class="muted">' + (correct > firstTry ? 'Po oprave na konci máš správne ' + correct + ' z ' + fl.length + '. ' : '') +
    (R.kind === "lesson" ? 'Hotové lekcie: ' + doneCount() + ' z ' + LESSONS.length + '.' : '') + '</p></div>';
  html += '<div class="stack">';
  if(R.kind === "lesson" && nl >= 0){
    html += '<button class="btn" data-act="open" data-val="' + nl + '">Ďalšia lekcia: ' + LESSONS[nl].h + ' ' + IC.arrow + '</button>';
  } else if(R.kind === "lesson"){
    html += '<button class="btn" data-act="review" data-val="-1">Opakovať všetko ' + IC.arrow + '</button>';
  } else {
    html += '<button class="btn" data-act="review" data-val="' + R.ti + '">Opakovať ešte ' + IC.arrow + '</button>';
  }
  html += '<button class="btn ghost" data-act="home">Domov</button></div>';
  if(correct < fl.length){
    html += '<div class="card"><h2>Toto si ešte nevedel</h2><p class="muted small">Spýtam sa ťa na to znova v ďalšej lekcii alebo pri opakovaní.</p><div>' + missesHtml(fl) + '</div></div>';
  }
  html += '</div>';
  app.innerHTML = html;
  window.scrollTo(0, 0);
}
function viewTestEnd(){
  var R = S.run, total = R.log.length, correct = 0, i, pct, g, html;
  for(i = 0; i < total; i++){ if(R.log[i].ok){ correct++; } }
  pct = total ? Math.round((correct / total) * 100) : 0;
  g = gradeOf(pct);
  html = '<div class="wrap">' +
    '<div class="top"><div class="sp"></div>' + soundBtn() + '</div>' +
    '<div class="card"><span class="label center">Písomka nanečisto</span><div class="grade">' + g + '</div>' +
    '<p class="center"><b>' + gradeWord(g) + '</b></p>' +
    '<div class="stats"><div class="stat"><b>' + pct + ' %</b>úspešnosť</div><div class="stat"><b>' + correct + '</b>správne</div><div class="stat"><b>' + (total - correct) + '</b>chyby</div></div>' +
    '<p class="small muted center">Známka: od 90 % = 1, od 75 % = 2, od 50 % = 3, od 30 % = 4</p></div>' +
    '<div class="stack"><button class="btn" data-act="test">Nová písomka</button><button class="btn ghost" data-act="home">Domov</button></div>';
  if(correct < total){ html += '<div class="card"><h2>Chyby</h2><div>' + missesHtml(R.log) + '</div></div>'; }
  html += '</div>';
  app.innerHTML = html;
  window.scrollTo(0, 0);
}
function viewCheat(){
  var html = '<div class="wrap">' +
    '<div class="top"><button class="back" data-act="home">' + IC.back + 'Domov</button></div>' +
    '<div class="card"><span class="tpill">Ťahák</span><h1>Čo treba vedieť na písomku</h1><p class="muted">Z každej lekcie to najdôležitejšie.</p></div>';
  LESSONS.forEach(function(L, li){
    html += '<div class="card lc" style="' + tvars(L.t) + '"><div class="sechead"><span class="secn">' + (li + 1) + '</span><h2>' + L.h + '</h2></div><ul class="mlist">' +
      L.must.map(function(m){ return '<li>' + IC.check + '<span>' + m + '</span></li>'; }).join("") + '</ul></div>';
  });
  html += '</div>';
  app.innerHTML = html;
}

function render(){
  if(S.screen === "home"){ viewHome(); }
  else if(S.screen === "topic"){ viewTopic(); }
  else if(S.screen === "lessonpage"){ viewLesson(); }
  else if(S.screen === "run"){ renderRun(true); return; }
  else if(S.screen === "lessonend"){ viewLessonEnd(); return; }
  else if(S.screen === "testend"){ viewTestEnd(); return; }
  else if(S.screen === "cheat"){ viewCheat(); }
  window.scrollTo(0, 0);
}

/* ===== OVLADANIE ===== */
app.addEventListener("click", function(ev){
  var el = ev.target;
  while(el && el !== app && !(el.getAttribute && el.getAttribute("data-act"))){ el = el.parentNode; }
  if(!el || el === app || el.disabled){ return; }
  handle(el.getAttribute("data-act"), el.getAttribute("data-val"));
});
/* Enter v policku: dalsie policko, v poslednom kontrola */
app.addEventListener("keydown", function(ev){
  var t = ev.target, m, nx;
  if(ev.key !== "Enter" || ev.shiftKey){ return; }
  if(!t || !t.classList || !t.classList.contains("txtin")){ return; }
  ev.preventDefault();
  m = /^in(\d+)$/.exec(t.id || "");
  nx = m ? document.getElementById("in" + (parseInt(m[1], 10) + 1)) : null;
  if(nx && !nx.disabled){ nx.focus(); return; }
  handle("check");
});
/* Enter mimo policka (na pocitaci): Dalej */
document.addEventListener("keydown", function(ev){
  var t = ev.target, btn;
  if(ev.key !== "Enter" || S.screen !== "run"){ return; }
  if(t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "BUTTON")){ return; }
  btn = document.getElementById("mainbtn");
  if(btn && !btn.disabled){ ev.preventDefault(); btn.click(); }
});

function handle(act, val){
  var R = S.run, q, i, el, vals;
  if(act === "home"){ S.screen = "home"; render(); return; }
  if(act === "sound"){
    P.sound = !P.sound; saveProgress();
    if(P.sound){ ensureAudio(); }
    if(S.screen === "run"){ renderRun(false); } else { render(); }
    return;
  }
  if(act === "topic"){ S.ti = parseInt(val, 10); S.screen = "topic"; render(); return; }
  if(act === "open"){ S.li = parseInt(val, 10); S.screen = "lessonpage"; render(); return; }
  if(act === "cheat"){ S.screen = "cheat"; render(); return; }
  if(act === "cnt"){ S.cnt = parseInt(val, 10); render(); return; }
  if(act === "lesson"){ ensureAudio(); startLesson(parseInt(val, 10)); return; }
  if(act === "review"){ ensureAudio(); startReview(parseInt(val, 10)); return; }
  if(act === "test"){ ensureAudio(); startTest(); return; }
  if(act === "reset"){
    if(window.confirm("Naozaj vymazať celý pokrok?")){ P.q = {}; P.done = {}; P.tick = 0; P.best = null; saveProgress(); render(); }
    return;
  }
  if(act === "quit"){
    if(R && R.kind === "test" && R.log.length && !window.confirm("Písomka ešte nie je dokončená. Naozaj ju chceš ukončiť?")){ return; }
    S.screen = "home"; render(); return;
  }
  if(!R || S.screen !== "run"){ return; }
  if(act === "next"){ if(R.locked){ nextStep(); } return; }
  if(act === "override"){ overrideRun(); return; }
  if(act === "check"){
    if(R.locked){ return; }
    q = R.q;
    vals = [];
    for(i = 0; i < R.ans.length; i++){ el = document.getElementById("in" + i); vals.push(el ? el.value : ""); }
    if(!vals.join("").replace(/\s/g, "")){ el = document.getElementById("in0"); if(el){ el.focus(); } return; }
    R.ans = vals;
    lockRun();
  }
}

loadProgress();
render();

/* offline: po prvom otvoreni sa appka ulozi do telefonu */
if("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){ /* bez offline rezimu appka funguje dalej */ });
  });
}
</script>

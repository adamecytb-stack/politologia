<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Politológia – štát a typy štátov</title>
<meta name="description" content="Učebná appka z politológie (9. ročník): štát, moc, občianstvo, územie, suverenita, symboly a typy štátov. Učenie s opakovaním a písomka nanečisto.">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Politológia">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
  /* svetly minimalisticky vzhlad: biela plocha, tmavy text, jedna modra, ciary namiesto kariet */
  :root{
    --bg:#ffffff;
    --soft:#f5f6f8;
    --line:#e4e7ec;
    --ink:#12141a;
    --muted:#636b7a;
    --faint:#9aa1ae;
    --accent:#2349d8;
    --accent-ink:#1a36a6;
    --accent-soft:#eef2fd;
    --learn:#9db1f2;
    --ok:#13803b;
    --ok-soft:#eaf6ee;
    --ok-ink:#0e5f2c;
    --bad:#c52a1f;
    --bad-soft:#fcedeb;
    --leg:#2349d8;
    --exe:#b45309;
    --jus:#0f766e;
    --font:"Figtree", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;}
  .wrap{
    max-width:640px;margin:0 auto;min-height:100vh;
    padding:12px max(20px, env(safe-area-inset-right)) 40px max(20px, env(safe-area-inset-left));
    padding-top:max(12px, env(safe-area-inset-top));
    display:flex;flex-direction:column;gap:28px;
  }
  .wrap.flow{gap:24px;padding-bottom:0;}
  h1{font-size:30px;font-weight:600;line-height:1.15;letter-spacing:-.6px;margin:0;text-wrap:balance;}
  h2{font-size:24px;font-weight:600;line-height:1.25;letter-spacing:-.3px;margin:0;text-wrap:balance;}
  h3{font-size:18px;font-weight:600;line-height:1.3;margin:0;}
  p{margin:0;}
  b{font-weight:600;}
  .muted{color:var(--muted);}
  .small{font-size:14px;}
  .label{font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted);}
  .stack{display:flex;flex-direction:column;gap:12px;}
  .stack.tight{gap:6px;}
  .stack.loose{gap:20px;}

  /* ---- tlacidla ---- */
  .btn{
    display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    height:54px;padding:0 18px;border:none;border-radius:12px;cursor:pointer;
    background:var(--accent);color:#fff;font-size:17px;font-weight:600;
  }
  .btn:disabled{background:#c9d2ee;cursor:default;}
  .btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--ink);height:50px;font-size:16px;}
  .btn.soft{background:var(--soft);color:var(--ink);height:50px;font-size:16px;}
  .btn.okb{background:var(--ok);}
  .btn.badb{background:var(--bad);}
  .btn svg{flex:0 0 auto;}
  .ibtn{
    flex:0 0 44px;width:44px;height:44px;border-radius:10px;border:none;background:transparent;
    display:flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer;
  }
  .ibtn.out{border:1px solid var(--line);}
  .tbtn{
    height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);
    display:flex;align-items:center;gap:6px;color:var(--ink);font-weight:600;font-size:15px;cursor:pointer;
  }
  .linkbtn{background:none;border:none;padding:0;font:inherit;color:var(--muted);text-decoration:underline;cursor:pointer;}
  .back{
    height:44px;padding:0 12px 0 4px;margin-left:-6px;border:none;background:transparent;border-radius:10px;
    display:flex;align-items:center;gap:4px;font-weight:600;font-size:15px;color:var(--ink);cursor:pointer;
  }

  /* ---- hlavicka ---- */
  .top{display:flex;align-items:center;gap:8px;min-height:44px;}
  .top .sp{flex:1;}
  .brand{display:flex;flex-direction:column;line-height:1.3;}
  .brand b{font-size:17px;font-weight:700;letter-spacing:-.2px;}
  .brand span{font-size:13px;color:var(--muted);}

  /* ---- domov ---- */
  .hero{display:flex;flex-direction:column;gap:14px;}
  .big{display:flex;align-items:baseline;gap:12px;}
  .big .n{font-size:64px;font-weight:600;line-height:.9;letter-spacing:-2px;font-variant-numeric:tabular-nums;}
  .big .t{font-size:17px;font-weight:500;line-height:1.25;}
  .center{text-align:center;}
  .topics{display:flex;flex-direction:column;}
  .trow{
    display:flex;gap:14px;width:100%;text-align:left;background:transparent;border:none;
    border-top:1px solid var(--line);padding:16px 0;color:var(--ink);cursor:pointer;font-size:16px;
  }
  .trow .tn{flex:0 0 16px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;}
  .trow .tb{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;}
  .trow .tt{font-weight:600;font-size:17px;line-height:1.25;}
  .trow .chev{flex:0 0 18px;color:var(--faint);margin-top:2px;}
  .dots{display:flex;flex-wrap:wrap;gap:4px;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--line);}
  .dot.l{background:var(--learn);}
  .dot.k{background:var(--ink);}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;border-top:1px solid var(--line);padding-top:12px;font-size:12.5px;color:var(--muted);}
  .legend span{display:flex;align-items:center;gap:6px;}
  .box{border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;}
  .tab{
    height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);
    font-size:14.5px;font-weight:600;color:var(--ink);cursor:pointer;
  }
  .tab.on{background:var(--ink);border-color:var(--ink);color:#fff;}
  .foot{font-size:13px;color:var(--muted);line-height:1.5;}
  .homegrid{display:flex;flex-direction:column;gap:36px;}

  /* ---- tema ---- */
  .crow{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:none;
    border-top:1px solid var(--line);padding:14px 0;color:var(--ink);cursor:pointer;font-size:16px;
  }
  .crow .cb{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .crow .ct{font-weight:600;}
  .crow .cs{font-size:13.5px;color:var(--muted);}
  .pill{font-size:12.5px;font-weight:600;padding:4px 9px;border-radius:999px;white-space:nowrap;background:var(--soft);color:var(--muted);}
  .pill.l{background:var(--accent-soft);color:var(--accent-ink);}
  .pill.k{background:var(--ink);color:#fff;}

  /* ---- karticka (obsah) ---- */
  .kick{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;font-size:13px;font-weight:600;color:var(--muted);}
  .kick .a{color:var(--accent);}
  .kick .sep{color:#c2c7d0;}
  .kick .tag{margin-left:auto;font-weight:500;}
  .rows{display:flex;flex-direction:column;border-bottom:1px solid var(--line);}
  .rows .r{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:14px 0;border-top:1px solid var(--line);}
  .rows .r .k{font-size:19px;font-weight:600;flex:0 1 auto;}
  .rows .r .v{font-size:16px;text-align:right;flex:0 1 60%;}
  .pts{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;}
  .pts.num{padding-left:24px;}
  .note{display:flex;gap:10px;font-size:15px;line-height:1.5;}
  .note svg{flex:0 0 20px;margin-top:2px;}
  .note .nl{color:var(--muted);}
  .extra{border:1px dashed #c2c7d0;border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.5;}
  .extra .nl{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:2px;}
  .warn{background:#fff6e5;border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.5;}
  .warn .nl{display:block;font-size:12.5px;font-weight:700;color:#8a5a00;margin-bottom:2px;}
  .powers{display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:10px;}
  .pw{border-top:3px solid var(--leg);padding-top:10px;display:flex;flex-direction:column;gap:4px;}
  .pw.exe{border-color:var(--exe);}
  .pw.jus{border-color:var(--jus);}
  .pw .pn{font-weight:700;font-size:16px;color:var(--leg);line-height:1.2;}
  .pw.exe .pn{color:var(--exe);}
  .pw.jus .pn{color:var(--jus);}
  .pw .pk{font-size:13px;color:var(--muted);line-height:1.3;}
  .pw .pi{font-size:14.5px;font-weight:600;line-height:1.3;margin-top:6px;}
  .figs{display:flex;gap:20px;align-items:center;flex-wrap:wrap;}
  .figs figure{margin:0;display:flex;flex-direction:column;gap:6px;align-items:flex-start;}
  .figs figcaption{font-size:13px;color:var(--muted);}
  .cardsep{border:none;border-top:1px solid var(--line);margin:8px 0;}

  /* ---- priebeh kola ---- */
  .ftop{display:flex;align-items:center;gap:12px;min-height:44px;}
  .ftop .ibtn{margin-left:-10px;}
  .prog{flex:1;height:4px;border-radius:999px;background:var(--line);overflow:hidden;}
  .prog span{display:block;height:4px;background:var(--ink);border-radius:999px;transition:width .3s ease;}
  .cnt{font-size:13.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .dock{
    position:-webkit-sticky;position:sticky;bottom:0;z-index:5;margin-top:auto;
    display:flex;flex-direction:column;gap:10px;background:var(--bg);
    padding:12px 0 max(20px, env(safe-area-inset-bottom));
  }
  .dock .hint{text-align:center;font-size:15px;color:var(--muted);min-height:54px;display:flex;align-items:center;justify-content:center;}
  .dock .two{display:flex;gap:10px;}
  .dock .two .btn{flex:1;}
  .srs{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45;color:var(--muted);}
  .srs svg{flex:0 0 18px;margin-top:1px;}

  /* ---- otazky ---- */
  .match{display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:10px;}
  .match .col{display:flex;flex-direction:column;gap:10px;}
  .mi{
    min-height:62px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);
    color:var(--ink);font-size:16px;font-weight:600;line-height:1.25;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;
  }
  .mi.r{font-weight:500;font-size:15px;}
  .mi.sel{border-color:var(--ink);background:var(--soft);}
  .mi.done{border-color:var(--ok);background:var(--ok-soft);color:var(--ok-ink);cursor:default;}
  .mi.wrong{border-color:var(--bad);background:var(--bad-soft);}
  .mi .no{flex:0 0 22px;height:22px;border-radius:50%;background:var(--ok);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .mwrong{font-size:15px;color:var(--bad);margin-top:-8px;}
  .grp{display:flex;flex-direction:column;}
  .grow{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;}
  .grow:last-child{border-bottom:1px solid var(--line);}
  .grow .gname{font-weight:600;font-size:16px;line-height:1.35;}
  .grow.okrow .gname{color:var(--ok-ink);}
  .grow.badrow .gname{color:var(--bad);}
  .gbtns{display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:8px;}
  .gb{
    min-height:44px;padding:8px 6px;border-radius:10px;border:1px solid var(--line);background:var(--bg);
    font-size:14.5px;font-weight:600;color:var(--ink);cursor:pointer;line-height:1.2;
  }
  .gb.on{background:var(--ink);border-color:var(--ink);color:#fff;}
  .gb.right{background:var(--ok);border-color:var(--ok);color:#fff;}
  .gb.wrongsel{border-color:var(--bad);color:var(--bad);text-decoration:line-through;}
  .gb:disabled{cursor:default;}
  .cloze{font-size:19px;line-height:2.3;}
  .blank{
    display:inline-flex;align-items:center;justify-content:center;min-width:84px;height:38px;padding:0 10px;margin:0 2px;
    border:none;border-bottom:2px solid var(--ink);border-radius:8px 8px 0 0;background:var(--soft);
    font-size:17px;font-weight:600;color:var(--ink);cursor:pointer;vertical-align:baseline;line-height:1;
  }
  .blank.empty{color:var(--faint);}
  .blank.okb{background:var(--ok-soft);border-color:var(--ok);color:var(--ok-ink);}
  .blank.badb{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);
    font-size:16px;font-weight:600;color:var(--ink);cursor:pointer;
  }
  .chip.used{visibility:hidden;}
  .words{display:flex;flex-wrap:wrap;gap:8px 6px;font-size:19px;}
  .word{
    min-height:44px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);
    font-size:18px;font-weight:500;color:var(--ink);cursor:pointer;
  }
  .word.badw{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);text-decoration:line-through;}
  .word.err{border-color:var(--ok);background:var(--ok-soft);color:var(--ink);text-decoration:line-through;}
  .word.fixw{border-color:var(--ok);background:var(--ok);color:#fff;}
  .word:disabled{cursor:default;}
  .inrow{display:flex;gap:12px;align-items:center;}
  .inrow .ix{flex:0 0 16px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;}
  .txtin{
    flex:1;min-width:0;width:100%;height:54px;padding:0 14px;border-radius:12px;border:1px solid #cfd4dc;background:var(--bg);
    font-family:inherit;font-size:18px;font-weight:500;color:var(--ink);outline:none;
  }
  textarea.txtin{height:auto;min-height:120px;padding:12px 14px;line-height:1.45;resize:vertical;}
  .txtin:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .txtin.okin{border-color:var(--ok);background:var(--ok-soft);}
  .txtin.badin{border-color:var(--bad);background:var(--bad-soft);}
  .txtin:disabled{opacity:1;-webkit-text-fill-color:var(--ink);}
  .hint2{font-size:14px;color:var(--muted);}
  .model{background:var(--soft);border-radius:12px;padding:14px 16px;font-size:15.5px;line-height:1.5;}
  .model .nl{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:4px;}
  .fb{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;font-size:15.5px;line-height:1.5;}
  .fb.ok{background:var(--ok-soft);}
  .fb.no{background:var(--bad-soft);}
  .fb .head{font-weight:700;font-size:16px;}
  .fb.ok .head{color:var(--ok-ink);}
  .fb.no .head{color:var(--bad);}

  /* ---- vysledky ---- */
  .grade{font-size:96px;font-weight:600;line-height:1;letter-spacing:-3px;text-align:center;}
  .stats{display:flex;justify-content:center;gap:28px;}
  .stat{display:flex;flex-direction:column;align-items:center;font-size:13.5px;color:var(--muted);}
  .stat b{font-size:24px;color:var(--ink);font-variant-numeric:tabular-nums;}
  .res{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);}
  .res .rk{flex:0 0 22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;}
  .res .rk.ok{background:var(--ok);}
  .res .rk.no{background:var(--bad);}
  .res .rt{flex:1;min-width:0;font-weight:600;}
  .res .rn{font-size:13.5px;color:var(--muted);white-space:nowrap;}
  .miss{padding:14px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;font-size:15px;}
  .miss .mq{font-weight:600;font-size:16px;}
  .miss .yours{color:var(--bad);}
  .miss .right{color:var(--ok-ink);}

  /* ---- tahak ---- */
  .ch{display:flex;flex-direction:column;}
  .ch .ci{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px;}
  .ch .ci h3{font-size:16px;}
  .ch .ci div{font-size:15px;line-height:1.5;color:#2c313c;}

  @media (hover:hover){
    .btn:hover:enabled{background:var(--accent-ink);}
    .btn.ghost:hover:enabled{background:var(--soft);}
    .btn.soft:hover:enabled{background:#eceef2;}
    .btn.okb:hover:enabled{background:#0f6b31;}
    .btn.badb:hover:enabled{background:#a82318;}
    .trow:hover .tt, .crow:hover .ct{color:var(--accent);}
    .mi:hover:enabled:not(.done), .chip:hover, .word:hover:enabled, .gb:hover:enabled, .tab:hover, .tbtn:hover{border-color:var(--ink);}
  }
  button:focus-visible, .txtin:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
  @media (min-width:900px){
    .wrap.home{max-width:1040px;}
    .homegrid{display:grid;grid-template-columns:minmax(0, 1fr) minmax(0, 1.1fr);gap:56px;align-items:start;}
    .wrap{padding-top:28px;}
    .wrap.flow .dock{padding-bottom:28px;}
  }
  @media (max-width:360px){
    .powers{grid-template-columns:1fr;}
    .rows .r{flex-direction:column;gap:2px;}
    .rows .r .v{text-align:left;}
  }
  @media (prefers-reduced-motion:reduce){
    .prog span{transition:none;}
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============================================================
   UCEBNA APLIKACIA - POLITOLOGIA: STAT A TYPY STATOV
   Obsah je zo skolskeho zosita. Bloky "extra" su dovysvetlenie
   navyse, bloky "warn" upozornuju na miesto, kde sa appka
   odklonila od zosita.
   ============================================================ */

/* ===== TEMY ===== */
var TOPICS = [
  {id:"moc",   title:"Štát a moc",           short:"Štát a neštát, znaky štátu, štátna moc, deľba moci"},
  {id:"obcan", title:"Občianstvo a územie",  short:"Ako sa získa občianstvo, čo patrí k územiu, anexia, cesia, akcesia"},
  {id:"suver", title:"Suverenita a symboly", short:"Vnútorná a vonkajšia suverenita, vlajka, znak, hymna, pečať"},
  {id:"typy",  title:"Typy štátov",          short:"Forma vlády, územné členenie, štátny režim"}
];

/* ===== POJMY (karticky) =====
   b     - obsah karticky: p (odsek), rows (pojem - vyznam), list, powers, flag, seal, tip, extra, warn
   easy  - otazky pre novy pojem (spajanie, roztriedenie, doplnanie)
   mid   - otazky pre pojem, ktory uz raz vedel (najdi chybu)
   hard  - otazky, kde odpoved pise sam (ako na pisomke)

   Typy otazok:
   match - spoj dvojice, pairs: [lavy, pravy]
   sort  - roztried do dvoch skupin g, "a" patri do g[0], "b" do g[1]
   cloze - doplň slova do vety, [slovo] je medzera, "extra" su slova navyse
   fix   - najdi zle slovo, {zle|spravne}
   txt   - napis odpoved, acc su uznane tvary, kw su skupiny klucovych slov (staci, ked je z kazdej skupiny aspon jedno)
   list  - napis n veci v lubovolnom poradi, items su uznane tvary kazdej veci
   self  - napis vlastnymi slovami, potom porovnaj so vzorom a ohodnot sa sam */
var CARDS = [
/* ---------- 1. STAT A MOC ---------- */
{id:"stat", t:0, h:"Štát a neštát",
 b:[
  {t:"p", x:"Štát a neštát majú latinské názvy."},
  {t:"rows", r:[["štát","status civilis"],["neštát","status naturalis"]]},
  {t:"tip", x:"<b>Civilis</b> ako civilizácia: ľudia žijú podľa pravidiel štátu. <b>Naturalis</b> ako príroda: štát nie je, je to prirodzený stav."}
 ],
 easy:[
  {t:"cloze", q:"Doplň latinské názvy.", s:"Štát je status [civilis], neštát je status [naturalis].", extra:["socialis","publicus"],

var MIN = 60000, HOUR = 3600000, DAY = 86400000;
var IV = [0, 10 * MIN, 20 * HOUR, 2 * DAY, 4 * DAY, 8 * DAY];
var KNOW = 3;
var KEY = "polit-pokrok-v1";
var P = {c:{}, best:null, sound:true};

function loadProgress(){
  try {
    var raw = window.localStorage.getItem(KEY);
    if(!raw){ return; }
    var o = JSON.parse(raw);
    if(o && typeof o === "object"){
      if(o.c && typeof o.c === "object"){ P.c = o.c; }
      if(o.best && typeof o.best === "object"){ P.best = o.best; }
      if(o.sound === false){ P.sound = false; }
    }
  } catch(err){ /* bez ulozeneho pokroku appka funguje dalej */ }
}
function saveProgress(){
  try { window.localStorage.setItem(KEY, JSON.stringify(P)); }
  catch(err){ /* sukromne okno alebo plne ulozisko */ }
}
function now(){ return Date.now(); }
function stOf(id){ return P.c[id] || null; }
function stateOf(id){
  var s = stOf(id);
  if(!s){ return "new"; }
  return s.b >= KNOW ? "know" : "learn";
}
function learn(id){
  if(!P.c[id]){ P.c[id] = {b:0, d:now(), n:0, w:0}; saveProgress(); }
}
function record(id, ok){
  var s = P.c[id] || (P.c[id] = {b:0, d:now(), n:0, w:0});
  var before = s.b;
  s.n++;
  if(ok){
    s.b = Math.min(s.b + 1, 5);
    s.d = now() + IV[s.b];
  } else {
    s.w++;
    s.b = s.b >= 2 ? 1 : 0;
    s.d = now();
  }
  saveProgress();
  return {before:before, after:s.b, due:s.d};
}

function whenText(ts){

var ac = null;
function ensureAudio(){
  if(!ac){
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(err){ ac = null; }
  }
  if(ac && ac.state === "suspended"){ ac.resume(); }
}
function beep(freq, dur, type, vol, delay){
  if(!P.sound){ return; }
  ensureAudio();
  if(!ac){ return; }
  var t = ac.currentTime + (delay || 0);
  var osc = ac.createOscillator();
  var gain = ac.createGain();
  osc.type = type || "sine";
  osc.frequency.setValueAtTime(freq, t);
  gain.gain.setValueAtTime(vol || 0.06, t);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(gain);
  gain.connect(ac.destination);
  osc.start(t);
  osc.stop(t + dur + 0.03);
}

/* ===== POMOCNE FUNKCIE ===== */
function shuffle(arr){
  var i, j, tmp;
  for(i = arr.length - 1; i > 0; i--){
    j = Math.floor(Math.random() * (i + 1));
    tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}
function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
/* male pismena, bez diakritiky, bez interpunkcie */
function norm(s){
  s = (s === null || s === undefined) ? "" : String(s);
  s = s.toLowerCase().trim();
  if(s.normalize){ s = s.normalize("NFD").replace(/[̀-ͯ]/g, ""); }
  s = s.replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
  return s;
}
function lev(a, b){
  var m = a.length, n = b.length, i, j, prev, cur, tmp;
  if(m === 0){ return n; }
  if(n === 0){ return m; }
  prev = [];
  for(j = 0; j <= n; j++){ prev[j] = j; }
  for(i = 1; i <= m; i++){
    cur = [i];
    for(j = 1; j <= n; j++){
      tmp = (a.charAt(i - 1) === b.charAt(j - 1)) ? 0 : 1;
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + tmp);
    }
    prev = cur;
  }
  return prev[n];
}
/* presna zhoda alebo maly preklep (dlhsie slova znesu viac); zaciatok slova musi sediet,
   inak by "symetricke" preslo ako "asymetricke" a "centralizovane" ako "decentralizovane" */
function accExact(val, acc){
  var v = norm(val), i;
  if(!v){ return false; }
  for(i = 0; i < acc.length; i++){ if(v === norm(acc[i])){ return true; } }
  return false;
}
function accOk(val, acc){
  var v = norm(val), i, a;
  if(!v){ return false; }
  for(i = 0; i < acc.length; i++){
    a = norm(acc[i]);
    if(v === a){ return true; }
    if(v.slice(0, 2) !== a.slice(0, 2)){ continue; }
    if(a.length > 5 && lev(v, a) <= 1){ return true; }
    if(a.length > 11 && lev(v, a) <= 2){ return true; }
  }
  return false;
}
/* klucove slova: z kazdej skupiny musi byt v odpovedi aspon jedno */
function kwOk(val, kw){
  var v = norm(val), i, j, hit;
  if(!v || !kw || !kw.length){ return false; }
  for(i = 0; i < kw.length; i++){
    hit = false;
    for(j = 0; j < kw[i].length; j++){ if(v.indexOf(kw[i][j]) >= 0){ hit = true; } }
    if(!hit){ return false; }
  }
  return true;
}
function txtOk(val, q){ return accOk(val, q.acc || []) || kwOk(val, q.kw); }
/* zoznam: kazde policko sa priradi inej veci, najprv presne zhody, potom preklepy */
function listMatch(vals, items){
  var res = [], used = {}, i, j, pass;
  for(i = 0; i < vals.length; i++){ res.push(-1); }
  for(pass = 0; pass < 2; pass++){
    for(i = 0; i < vals.length; i++){
      if(res[i] >= 0 || !norm(vals[i])){ continue; }
      for(j = 0; j < items.length; j++){
        if(used[j]){ continue; }
        if(pass === 0 ? accExact(vals[i], items[j]) : accOk(vals[i], items[j])){ res[i] = j; used[j] = true; break; }
      }
    }
  }
  return res;
}
function esc(s){
  return String(s === null || s === undefined ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function prepare(src, card){
  var q = {src:src, t:src.t, q:src.q, e:src.e || "", id:card.id}, i, arr, m, parts, before, after, suffix;
  if(src.t === "match"){
    q.L = []; q.R = [];
    for(i = 0; i < src.pairs.length; i++){ q.L.push({x:src.pairs[i][0], k:i}); q.R.push({x:src.pairs[i][1], k:i}); }
    shuffle(q.L); shuffle(q.R);
  } else if(src.t === "sort"){
    arr = [];
    for(i = 0; i < src.a.length; i++){ arr.push({x:src.a[i], g:0}); }
    for(i = 0; i < src.b.length; i++){ arr.push({x:src.b[i], g:1}); }
    q.items = shuffle(arr);
    q.g = src.g;
  } else if(src.t === "cloze"){
    /* "text [slovo] text" -> casti textu a medzery */
    q.segs = []; q.ans = [];
    parts = src.s.split(/\[([^\]]+)\]/);
    for(i = 0; i < parts.length; i++){
      if(i % 2 === 0){ if(parts[i]){ q.segs.push({x:parts[i]}); } }
      else { q.segs.push({b:q.ans.length}); q.ans.push(parts[i]); }
    }
    arr = q.ans.concat(src.extra || []);
    q.bank = shuffle(arr.map(function(x){ return {x:x}; }));
  } else if(src.t === "fix"){
    m = src.s.match(/^(.*?)\{([^|}]+)\|([^}]+)\}(.*)$/);
    before = m[1]; after = m[4];
    suffix = (after.match(/^[.,;:!?…“”"]+/) || [""])[0];
    after = after.slice(suffix.length);
    q.words = [];
    before.split(" ").forEach(function(w){ if(w){ q.words.push(w); } });
    q.bad = q.words.length;
    q.words.push(m[2] + suffix);
    after.split(" ").forEach(function(w){ if(w){ q.words.push(w); } });
    q.wrongWord = m[2];
    q.right = m[3];
  } else if(src.t === "txt"){
    q.acc = src.acc || []; q.kw = src.kw; q.sol = src.sol || q.acc[0];
  } else if(src.t === "list"){
    q.n = src.n; q.items = src.items;
  } else if(src.t === "self"){
    q.model = src.model;
  }
  return q;
}
function blankAns(q){
  if(q.t === "match"){ return {selL:-1, selR:-1, mt:{}, ord:{}, wr:null, miss:0}; }
  if(q.t === "sort"){ return q.items.map(function(){ return -1; }); }
  if(q.t === "cloze"){ return q.ans.map(function(){ return -1; }); }
  if(q.t === "fix"){ return -1; }
  if(q.t === "list"){ var a = [], i; for(i = 0; i < q.n; i++){ a.push(""); } return a; }
  if(q.t === "self"){ return {text:"", shown:false, ok:null}; }
  return "";
}
function isOk(q, a){
  var i, res;
  if(q.t === "match"){ return a.miss === 0; }
  if(q.t === "sort"){ for(i = 0; i < q.items.length; i++){ if(a[i] !== q.items[i].g){ return false; } } return true; }
  if(q.t === "cloze"){ for(i = 0; i < q.ans.length; i++){ if(a[i] < 0 || q.bank[a[i]].x !== q.ans[i]){ return false; } } return true; }
  if(q.t === "fix"){ return a === q.bad; }
  if(q.t === "txt"){ return txtOk(a, q); }
  if(q.t === "list"){ res = listMatch(a, q.items); for(i = 0; i < q.n; i++){ if(res[i] < 0){ return false; } } return true; }
  if(q.t === "self"){ return a.ok === true; }
  return false;
}
function ready(q, a){
  var i;
  if(q.t === "sort" || q.t === "cloze"){ for(i = 0; i < a.length; i++){ if(a[i] < 0){ return false; } } return true; }
  return true;
}
function solText(q){
  var i, out = [], g0 = [], g1 = [];
  if(q.t === "txt"){ return esc(q.sol); }
  if(q.t === "list"){
    for(i = 0; i < q.items.length; i++){ out.push(q.items[i][0]); }
    return q.n === q.items.length ? out.join(", ") : "stačí " + q.n + " z týchto: " + out.join(", ");
  }
  if(q.t === "fix"){ return "namiesto „" + q.wrongWord + "“ má byť „" + q.right + "“"; }
  if(q.t === "cloze"){
    for(i = 0; i < q.segs.length; i++){ out.push(q.segs[i].x !== undefined ? q.segs[i].x : '<b>' + q.ans[q.segs[i].b] + '</b>'); }
    return out.join("");
  }
  if(q.t === "sort"){
    for(i = 0; i < q.items.length; i++){ (q.items[i].g === 0 ? g0 : g1).push(q.items[i].x); }
    return '<b>' + q.g[0] + ':</b> ' + g0.join(", ") + '<br><b>' + q.g[1] + ':</b> ' + g1.join(", ");
  }
  if(q.t === "match"){
    for(i = 0; i < q.src.pairs.length; i++){ out.push(q.src.pairs[i][0] + ' – ' + q.src.pairs[i][1]); }
    return out.join("<br>");
  }
  if(q.t === "self"){ return q.model; }
  return "";
}
function yourText(q, a){
  if(q.t === "txt"){ return esc(String(a).trim()) || "(nič)"; }
  if(q.t === "list"){ return a.map(function(x){ return esc(String(x).trim()) || "–"; }).join(", "); }
  if(q.t === "self"){ return esc(String(a.text).trim()) || "(nič)"; }
  return "";
}
var KIND = {match:"Spájanie", sort:"Roztrieď", cloze:"Doplň do vety", fix:"Nájdi chybu", txt:"Napíš", list:"Napíš", self:"Napíš vlastnými slovami"};

/* ktoru otazku dat k pojmu: novy pojem lahko, raz vedel stredne, potom pise sam */
function chooseQ(card){
  var s = stOf(card.id), b = s ? s.b : 0;
  var pool = b <= 0 ? card.easy : (b === 1 ? (card.mid.length ? card.mid : card.easy) : card.hard);
  return prepare(pick(pool), card);
}

/* ===== KOLO: poradie krokov =====
   nove pojmy: najprv karticka, otazka na ne az o 3 kroky neskor;
   medzitym idu opakovania z inych pojmov */
function buildRound(ti, force){
  var reviews, news, Q = [], pending = [], ri = 0, ni = 0, sinceCard = 9, guard = 0, k, pi, cand;
  if(force){
    cand = CARDS.filter(function(c){ return stOf(c.id) && (ti < 0 || c.t === ti); });
    cand.sort(function(x, y){ return (stOf(x.id).b - stOf(y.id).b) || (stOf(x.id).d - stOf(y.id).d); });
    reviews = cand.slice(0, 8);
  } else {
    reviews = dueCards(ti).slice(0, 8);
  }
  shuffle(reviews);
  news = freshCards(ti).slice(0, newPerRound(reviews.length));
  while((ri < reviews.length || ni < news.length || pending.length) && guard < 200){
    guard++;
    pi = -1;
    for(k = 0; k < pending.length; k++){ if(pending[k].wait <= 0){ pi = k; break; } }
    if(pi >= 0){
      Q.push({k:"q", id:pending[pi].id});
      pending.splice(pi, 1);
      sinceCard++;
    } else if(ni < news.length && (sinceCard >= 2 || ri >= reviews.length)){
      Q.push({k:"card", id:news[ni].id});
      pending.push({id:news[ni].id, wait:3});
      ni++;
      sinceCard = 0;
      continue;
    } else if(ri < reviews.length){
      Q.push({k:"q", id:reviews[ri].id});
      ri++;
      sinceCard++;
    } else {
      pending.sort(function(x, y){ return x.wait - y.wait; });
      Q.push({k:"q", id:pending[0].id});
      pending.shift();
      sinceCard++;
    }
    for(k = 0; k < pending.length; k++){ pending[k].wait--; }
  }
  return Q;
}
function startRound(ti, force){
  var Q = buildRound(ti, force);
  if(!Q.length){ return; }
  S.run = {kind:"round", ti:ti, queue:Q, i:0, q:null, ans:null, locked:false, ok:false, note:"",
    learned:{}, again:{}, reasks:{}, log:[]};
  enterStep();
  S.screen = "run";
  render();
}
function startTest(){
  var pools = [], order = [], out = [], i, any = true, c, q;
  for(i = 0; i < TOPICS.length; i++){
    pools.push(shuffle(cardsOf(i).slice()));
    order.push(i);
  }
  while(out.length < S.cnt && any){
    any = false;
    shuffle(order);
    for(i = 0; i < order.length && out.length < S.cnt; i++){
      if(pools[order[i]].length){
        c = pools[order[i]].pop();
        q = prepare(pick(c.hard), c);
        out.push({k:"q", id:c.id, pre:q});
        any = true;
      }
    }
  }
  S.run = {kind:"test", ti:-1, queue:shuffle(out), i:0, q:null, ans:null, locked:false, ok:false, note:"",
    learned:{}, again:{}, reasks:{}, log:[]};
  enterStep();
  S.screen = "run";
  render();
}
function enterStep(){
  var R = S.run, st = R.queue[R.i];
  R.locked = false; R.ok = false; R.note = "";
  if(st.k === "q"){
    R.q = st.pre || chooseQ(BYID[st.id]);
    R.ans = blankAns(R.q);
  } else {
    R.q = null; R.ans = null;
  }
}
function lockRun(){
  var R = S.run, q = R.q, ok = isOk(q, R.ans), r, s;
  R.locked = true;
  R.ok = ok;
  R.log.push({q:q, ans:R.ans, ok:ok, id:q.id});
  if(ok){ sGood(); } else { sBad(); }
  if(R.kind === "round"){
    r = record(q.id, ok);
    if(!ok){
      if((R.reasks[q.id] || 0) < 2){
        R.reasks[q.id] = (R.reasks[q.id] || 0) + 1;
        R.queue.splice(Math.min(R.i + 4, R.queue.length), 0, {k:"q", id:q.id});
        R.note = "Vráti sa ti to ešte v tomto kole, trochu ľahšie.";
      } else {
        R.note = "Vráti sa ti to v ďalšom kole.";
      }
    } else if(R.learned[q.id] && !R.again[q.id] && r.after === 1){
      R.again[q.id] = true;
      R.queue.push({k:"q", id:q.id});
      R.note = "Na konci kola sa ťa na to spýtam ešte raz, trochu ťažšie.";
    } else if(r.after >= 2 && r.before < 2){
      R.note = "Nabudúce (" + whenText(r.due) + ") to už napíšeš sám, bez možností.";
    } else {
      R.note = "Znova sa ťa na to spýtam " + whenText(r.due) + ".";
    }
  } else if(!ok){
    /* chyba v pisomke: pojem sa vrati do opakovania */
    s = P.c[q.id];
    if(s){ s.b = Math.min(s.b, 1); s.d = now(); }
    else { P.c[q.id] = {b:0, d:now(), n:1, w:1}; }
    saveProgress();
  }
  renderRun(false);
}
function nextStep(){
  var R = S.run;
  if(R.i >= R.queue.length - 1){ finishRun(); return; }
  R.i++;
  enterStep();
  renderRun(true);
}
function finishRun(){
  var R = S.run, correct = 0, i, pct;
  for(i = 0; i < R.log.length; i++){ if(R.log[i].ok){ correct++; } }
  if(R.kind === "test" && R.log.length){
    pct = Math.round((correct / R.log.length) * 100);
    if(!P.best || pct > P.best.pct){ P.best = {pct:pct, grade:gradeOf(pct)}; }
    saveProgress();
  }
  sWin();
  S.screen = R.kind === "test" ? "testend" : "roundend";
  render();
}

      else if(a.wr && a.wr[1] === i){ cls += " wrong"; }
      else if(a.selR === i){ cls += " sel"; }
      html += '<button class="' + cls + '" data-act="mr" data-val="' + i + '"' + dis + '>' +
        (used.hasOwnProperty(i) ? '<span class="no">' + used[i] + '</span>' : '') + '<span>' + q.R[i].x + '</span></button>';
    }
    html += '</div></div>';
    if(a.wr && !L){ html += '<div class="mwrong">„' + q.L[a.wr[0]].x + '“ nepatrí k „' + q.R[a.wr[1]].x + '“. Skús iný.</div>'; }
  } else if(q.t === "sort"){
    html += '<div class="grp">';
    for(i = 0; i < q.items.length; i++){
      var mine = a[i], right = q.items[i].g, n;
      html += '<div class="grow' + (L ? (mine === right ? " okrow" : " badrow") : "") + '"><div class="gname">' + q.items[i].x + '</div><div class="gbtns">';
      for(n = 0; n < 2; n++){
        cls = "gb";
        if(!L && mine === n){ cls += " on"; }
        if(L && n === right){ cls += " right"; }
        if(L && n === mine && mine !== right){ cls += " wrongsel"; }
        html += '<button class="' + cls + '" data-act="srt" data-val="' + i + ':' + n + '"' + dis + '>' + q.g[n] + '</button>';
      }
      html += '</div></div>';
    }
    html += '</div>';
  } else if(q.t === "cloze"){
    html += '<div class="cloze">';
    for(i = 0; i < q.segs.length; i++){
      var sg = q.segs[i];
      if(sg.x !== undefined){ html += esc(sg.x); continue; }
      var fill = a[sg.b];
      cls = "blank" + (fill < 0 ? " empty" : "");
      if(L){ cls += (fill >= 0 && q.bank[fill].x === q.ans[sg.b]) ? " okb" : " badb"; }
      html += '<button class="' + cls + '" data-act="blank" data-val="' + sg.b + '"' + dis + ' aria-label="Medzera ' + (sg.b + 1) + '">' +
        (fill >= 0 ? esc(q.bank[fill].x) : (sg.b + 1)) + '</button>';
    }
    html += '</div>';
    if(!L){
      html += '<div class="chips">';
      for(i = 0; i < q.bank.length; i++){
        html += '<button class="chip' + (a.indexOf(i) >= 0 ? " used" : "") + '" data-act="chip" data-val="' + i + '">' + esc(q.bank[i].x) + '</button>';
      }
      html += '</div><div class="hint2">Ťukni na slovo a doplní sa do najbližšej medzery. Ťuknutím na medzeru ho vrátiš.</div>';
    }
  } else if(q.t === "fix"){
    html += '<div class="words">';
    for(i = 0; i < q.words.length; i++){
      cls = "word";
      if(L && i === q.bad){ cls += " err"; }
      if(L && i === a && a !== q.bad){ cls += " badw"; }
      html += '<button class="' + cls + '" data-act="fix" data-val="' + i + '"' + dis + '>' + esc(q.words[i]) + '</button>';
      if(L && i === q.bad){ html += '<span class="word fixw">' + esc(q.right) + '</span>'; }
    }
    html += '</div>';
  } else if(q.t === "txt"){
    html += '<input class="txtin' + (L ? (R.ok ? " okin" : " badin") : "") + '" id="in0" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="Napíš odpoveď"' +
      (L ? ' disabled value="' + esc(a) + '"' : '') + '>';
    if(!L){ html += '<div class="hint2">Na diakritike ani na malom preklepe nezáleží.</div>'; }
  } else if(q.t === "list"){
    res = L ? listMatch(a, q.items) : [];
    html += '<div class="stack">';
    for(i = 0; i < q.n; i++){
      html += '<div class="inrow"><span class="ix">' + (i + 1) + '</span><input class="txtin' + (L ? (res[i] >= 0 ? " okin" : " badin") : "") + '" id="in' + i + '" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="' + (i < q.n - 1 ? "next" : "done") + '"' +
        (L ? ' disabled value="' + esc(a[i]) + '"' : '') + '></div>';
    }
    html += '</div>';
    if(!L){ html += '<div class="hint2">Poradie nevadí. Diakritika ani malý preklep nevadia.</div>'; }
  } else if(q.t === "self"){
    html += '<textarea class="txtin" id="in0" placeholder="Napíš odpoveď vlastnými slovami"' + (a.shown ? ' disabled' : '') + '>' + esc(a.text) + '</textarea>';
    if(a.shown){ html += '<div class="model"><span class="nl">Správna odpoveď</span>' + q.model + '</div>'; }
    else { html += '<div class="hint2">Najprv napíš, čo vieš. Potom ti ukážem správnu odpoveď a sám posúdiš, či si to vedel.</div>'; }
  }

  if(L){
    html += '<div class="fb ' + (R.ok ? "ok" : "no") + '"><span class="head">' + (R.ok ? "Správne" : "Nesprávne") + '</span>' +
      (!R.ok && (q.t === "txt" || q.t === "list" || q.t === "fix") ? '<span>Správne je: <b>' + solText(q) + '</b></span>' : '') +
      (!R.ok && (q.t === "cloze") ? '<span>' + solText(q) + '</span>' : '') +
      (q.e ? '<span>' + q.e + '</span>' : '') + '</div>';
  }

  html += '<div class="dock">';
  if(L){
    if(R.note){ html += '<div class="srs">' + IC.again + '<span>' + R.note + '</span></div>'; }
    html += '<button class="btn" data-act="next" id="mainbtn">' + (R.i >= R.queue.length - 1 ? (R.kind === "test" ? "Vyhodnotiť písomku" : "Ukončiť kolo") : 'Ďalej ' + IC.arrow) + '</button>';
  } else if(q.t === "match"){
    html += '<div class="hint">Ťukni na pojem a potom na to, k čomu patrí.</div>';
  } else if(q.t === "fix"){
    html += '<div class="hint">Ťukni na slovo, ktoré tam nepatrí.</div>';
  } else if(q.t === "self"){
    if(a.shown){
      html += '<div class="two"><button class="btn badb" data-act="selfno">Nevedel som</button><button class="btn okb" data-act="selfok">Vedel som</button></div>';
    } else {
      html += '<button class="btn" data-act="selfshow" id="mainbtn">Ukázať správnu odpoveď</button>';
    }
  } else {
    html += '<button class="btn" data-act="check" id="mainbtn"' + (ready(q, a) ? "" : " disabled") + '>Skontrolovať</button>';
  }
  html += '</div>';
  return html;
}

function viewRoundEnd(){
  var R = S.run, seen = {}, order = [], i, it, correct = 0, html;
  for(i = 0; i < R.log.length; i++){
    it = R.log[i];
    if(it.ok){ correct++; }
    if(!seen[it.id]){ seen[it.id] = {ok:true}; order.push(it.id); }
    if(!it.ok){ seen[it.id].ok = false; }
  }
  html = '<div class="wrap">' +
    '<div class="top"><div class="sp"></div>' + soundBtn() + '</div>' +
    '<div class="stack tight"><span class="label">Kolo hotové</span><h1>' + correct + ' z ' + R.log.length + ' správne</h1>' +
    '<p class="muted">Tu vidíš, kedy sa ti ktorý pojem vráti.</p></div><div>';
  order.forEach(function(id){
    var s = stOf(id), ok = seen[id].ok;
    html += '<div class="res"><span class="rk ' + (ok ? "ok" : "no") + '">' + (ok ? IC.check : IC.cross) + '</span>' +
      '<span class="rt">' + BYID[id].h + '</span><span class="rn">' + (s.d <= now() ? "hneď v ďalšom kole" : whenText(s.d)) + '</span></div>';
  });
  if(!order.length){ html += '<p class="muted">V tomto kole boli len nové pojmy.</p>'; }
  html += '</div><div class="stack">';
  if(dueCards(-1).length + freshCards(-1).length > 0){
    html += '<button class="btn" data-act="round" data-val="-1">Ďalšie kolo ' + IC.arrow + '</button>';
  } else {
    html += '<button class="btn" data-act="force" data-val="-1">Precvičiť ešte ' + IC.arrow + '</button>';
  }
  html += '<button class="btn ghost" data-act="home">Domov</button></div></div>';
  app.innerHTML = html;
  window.scrollTo(0, 0);
}
function viewTestEnd(){
  var R = S.run, total = R.log.length, correct = 0, i, pct, g, html, it;
  for(i = 0; i < total; i++){ if(R.log[i].ok){ correct++; } }
  pct = total ? Math.round((correct / total) * 100) : 0;
  g = gradeOf(pct);
  html = '<div class="wrap">' +
    '<div class="top"><div class="sp"></div>' + soundBtn() + '</div>' +
    '<div class="stack"><span class="label center">Písomka nanečisto</span><div class="grade">' + g + '</div>' +
    '<p class="center"><b>' + gradeWord(g) + '</b></p>' +
    '<div class="stats"><div class="stat"><b>' + pct + ' %</b>úspešnosť</div><div class="stat"><b>' + correct + '</b>správne</div><div class="stat"><b>' + (total - correct) + '</b>chyby</div></div>' +
    '<p class="small muted center">Známka: od 90 % = 1, od 75 % = 2, od 50 % = 3, od 30 % = 4</p></div>' +
    '<div class="stack"><button class="btn" data-act="test">Nová písomka</button><button class="btn ghost" data-act="home">Domov</button></div>';
  if(correct < total){
    html += '<div><h2 style="margin-bottom:6px;">Chyby</h2><p class="muted small" style="margin-bottom:8px;">Tieto pojmy som ti vrátil do opakovania.</p>';
    for(i = 0; i < total; i++){
      it = R.log[i];
      if(it.ok){ continue; }
      html += '<div class="miss"><span class="mq">' + it.q.q + '</span>' +
        '<span>Tvoja odpoveď: <span class="yours">' + yourText(it.q, it.ans) + '</span></span>' +
        '<span>Správne: <span class="right">' + solText(it.q) + '</span></span></div>';
    }
    html += '</div>';
  }
  html += '</div>';
  app.innerHTML = html;
  window.scrollTo(0, 0);
}
function viewCheat(){
  var html = '<div class="wrap">' +
    '<div class="top"><button class="back" data-act="home">' + IC.back + 'Domov</button></div>' +
    '<div class="stack tight"><span class="label">Ťahák</span><h1>Všetko na jednom mieste</h1></div>';
  TOPICS.forEach(function(t, ti){
    html += '<div class="stack tight"><h2>' + (ti + 1) + '. ' + t.title + '</h2><div class="ch">';
    cardsOf(ti).forEach(function(c){
      html += '<div class="ci"><h3>' + c.h + '</h3><div>' + cheatText(c) + '</div></div>';
    });
    html += '</div></div>';
  });
  html += '</div>';
  app.innerHTML = html;
}
function cheatText(c){
  var out = [];
  c.b.forEach(function(b){
    if(b.t === "p"){ out.push(b.x); }
    else if(b.t === "rows"){ out.push(b.r.map(function(r){ return '<b>' + r[0] + '</b>' + (r[1] ? ' – ' + r[1] : ''); }).join(" · ")); }
    else if(b.t === "list"){ out.push(b.li.join(" · ")); }
    else if(b.t === "powers"){ out.push("<b>legislatíva</b> – zákonodarná – NR SR · <b>exekutíva</b> – výkonná – prezident + vláda SR · <b>justícia</b> – súdna – Ústavný a Najvyšší súd SR"); }
  });
  return out.join("<br>");
}

function render(){
  if(S.screen === "home"){ viewHome(); }
  else if(S.screen === "topic"){ viewTopic(); }
  else if(S.screen === "card"){ viewCard(); }
  else if(S.screen === "read"){ viewRead(); }
  else if(S.screen === "run"){ renderRun(true); return; }
  else if(S.screen === "roundend"){ viewRoundEnd(); return; }
  else if(S.screen === "testend"){ viewTestEnd(); return; }
  else if(S.screen === "cheat"){ viewCheat(); }
  window.scrollTo(0, 0);
}

/* ===== OVLADANIE ===== */
app.addEventListener("click", function(ev){
  var el = ev.target;
  while(el && el !== app && !(el.getAttribute && el.getAttribute("data-act"))){ el = el.parentNode; }
  if(!el || el === app || el.disabled){ return; }
  handle(el.getAttribute("data-act"), el.getAttribute("data-val"));
});
app.addEventListener("keydown", function(ev){
  var t = ev.target, R = S.run, m, nx;
  if(ev.key !== "Enter"){ return; }
  if(t && t.tagName === "TEXTAREA"){ return; }
  if(t && t.classList && t.classList.contains("txtin")){
    ev.preventDefault();
    m = /^in(\d+)$/.exec(t.id || "");
    if(R && R.q && R.q.t === "list" && m && parseInt(m[1], 10) < R.q.n - 1){
      nx = document.getElementById("in" + (parseInt(m[1], 10) + 1));
      if(nx){ nx.focus(); return; }
    }
    handle("check");
  }
});
/* Enter mimo policka: na pocitaci ide dalej alebo kontroluje */
document.addEventListener("keydown", function(ev){
  var t = ev.target, btn;
  if(ev.key !== "Enter" || S.screen !== "run"){ return; }
  if(t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "BUTTON")){ return; }
  btn = document.getElementById("mainbtn");
  if(btn && !btn.disabled){ ev.preventDefault(); btn.click(); }
});

function handle(act, val){
  var R = S.run, q, a, i, parts, vals, el, k;
  if(act === "home"){ S.screen = "home"; render(); return; }
  if(act === "sound"){
    P.sound = !P.sound; saveProgress();
    if(P.sound){ ensureAudio(); }
    if(S.screen === "run"){ renderRun(false); } else { render(); }
    return;
  }
  if(act === "topic"){ S.ti = parseInt(val, 10); S.screen = "topic"; render(); return; }
  if(act === "card"){ S.cid = val; S.screen = "card"; render(); return; }
  if(act === "read"){ S.ti = parseInt(val, 10); S.screen = "read"; render(); return; }
  if(act === "cheat"){ S.screen = "cheat"; render(); return; }
  if(act === "cnt"){ S.cnt = parseInt(val, 10); render(); return; }
  if(act === "round"){ ensureAudio(); startRound(parseInt(val, 10), false); return; }
  if(act === "force"){ ensureAudio(); startRound(parseInt(val, 10), true); return; }
  if(act === "test"){ ensureAudio(); startTest(); return; }
  if(act === "reset"){
    if(window.confirm("Naozaj vymazať celý pokrok?")){ P.c = {}; P.best = null; saveProgress(); render(); }
    return;
  }
  if(act === "quit"){
    if(R && R.kind === "test" && R.log.length && !window.confirm("Písomka ešte nie je dokončená. Naozaj ju chceš ukončiť?")){ return; }
    S.screen = "home"; render(); return;
  }
  if(!R || S.screen !== "run"){ return; }
  if(act === "learned"){
    k = R.queue[R.i].id;
    learn(k);
    R.learned[k] = true;
    nextStep();
    return;
  }
  if(act === "next"){ if(R.locked){ nextStep(); } return; }
  if(R.locked || !R.q){ return; }
  q = R.q; a = R.ans;
  if(act === "ml" || act === "mr"){
    i = parseInt(val, 10);
    if(act === "ml"){
      if(a.mt.hasOwnProperty(i)){ return; }
      a.wr = null;
      if(a.selR >= 0){ tryPair(i, a.selR); } else { a.selL = (a.selL === i ? -1 : i); }
    } else {
      for(k in a.mt){ if(a.mt[k] === i){ return; } }
      a.wr = null;
      if(a.selL >= 0){ tryPair(a.selL, i); } else { a.selR = (a.selR === i ? -1 : i); }
    }
    if(Object.keys(a.mt).length === q.L.length){ lockRun(); return; }
    renderRun(false);
    return;
  }
  if(act === "srt"){
    parts = val.split(":");
    a[parseInt(parts[0], 10)] = parseInt(parts[1], 10);
    renderRun(false);
    return;
  }
  if(act === "chip"){
    i = parseInt(val, 10);
    if(a.indexOf(i) >= 0){ return; }
    k = a.indexOf(-1);
    if(k < 0){ return; }
    a[k] = i;
    renderRun(false);
    return;
  }
  if(act === "blank"){
    a[parseInt(val, 10)] = -1;
    renderRun(false);
    return;
  }
  if(act === "fix"){ R.ans = parseInt(val, 10); lockRun(); return; }
  if(act === "selfshow"){
    el = document.getElementById("in0");
    a.text = el ? el.value : "";
    a.shown = true;
    renderRun(false);
    return;
  }
  if(act === "selfok" || act === "selfno"){ a.ok = (act === "selfok"); lockRun(); return; }
  if(act === "check"){
    if(q.t === "txt"){
      el = document.getElementById("in0");
      if(!el || !el.value.replace(/\s/g, "")){ if(el){ el.focus(); } return; }
      R.ans = el.value;
    } else if(q.t === "list"){
      vals = [];
      for(i = 0; i < q.n; i++){ el = document.getElementById("in" + i); vals.push(el ? el.value : ""); }
      if(!vals.join("").replace(/\s/g, "")){ el = document.getElementById("in0"); if(el){ el.focus(); } return; }
      R.ans = vals;
    } else if(!ready(q, a)){ return; }
    lockRun();
  }
}
function tryPair(l, r){
  var R = S.run, q = R.q, a = R.ans;
  if(q.L[l].k === q.R[r].k){
    a.mt[l] = r;
    a.ord[l] = Object.keys(a.mt).length;
    a.selL = -1; a.selR = -1;
  } else {
    a.wr = [l, r];
    a.miss++;
    a.selL = -1; a.selR = -1;
    sBad();
  }
}

loadProgress();
render();

  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){ /* bez offline rezimu appka funguje dalej */ });
  });
}
